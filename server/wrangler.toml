# 团子游戏 · 联机服务器（Cloudflare Workers + Durable Objects，免费套餐可用）
name = "dango-games"
main = "worker.js"
compatibility_date = "2024-11-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]
