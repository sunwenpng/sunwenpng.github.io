<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>团团卡丁车</title>
<meta name="description" content="原创 3D 卡丁车：8 位萌系车手、6 条赛道、杯赛、车库改装、漂移攒加速、双道具栏、飞跃特技。">
<style>
:root{--bg:#123a7a;--panel:#163f86;--panel2:#1d4fa3;--line:rgba(255,255,255,.22);--fg:#fff;--muted:#cfe0ff;--gold:#ffd23f;--pink:#ff6fa5;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{pointer-events:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#probe{position:fixed;visibility:hidden;pointer-events:none;inset:0;padding:var(--st) var(--sr) var(--sb) var(--sl)}
.screen{position:fixed;inset:0;display:flex;padding:calc(var(--st) + 14px) max(16px,var(--sr)) calc(var(--sb) + 14px) max(16px,var(--sl));background:radial-gradient(ellipse at 50% 0,rgba(80,170,255,.55),rgba(10,40,100,.88) 70%);z-index:10;overflow:auto}
.screen.dim{background:rgba(8,24,60,.72);backdrop-filter:blur(3px)}
.screen[hidden]{display:none}
.box{width:100%;max-width:860px;margin:auto}
h1{margin:0;text-align:center;font-size:clamp(38px,9vw,64px);font-weight:900;letter-spacing:.04em;color:#fff;-webkit-text-stroke:2px #0b3a8a;text-shadow:0 5px 0 #ff6fa5,0 10px 0 #0b3a8a}
h2{margin:0 0 10px;text-align:center;font-size:26px;font-weight:900;text-shadow:0 3px 0 #0b3a8a}
h3{margin:14px 0 8px;font-size:16px}
.sub{color:var(--muted);text-align:center;font-size:13px;margin:10px 0 14px;line-height:1.6}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:6px;gap:10px}
.top a{color:var(--muted);text-decoration:none}
.coins{color:var(--gold);font-weight:900}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:2px solid rgba(255,255,255,.35);background:var(--panel2);border-radius:16px;padding:12px 20px;font-size:17px;font-weight:900;min-height:50px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.primary{background:linear-gradient(180deg,#ffdd4a,#ff9d1c);color:#4a2500;border-color:#fff3b0}
.btn.free{background:linear-gradient(180deg,#ff8fbd,#e0457b);border-color:#ffd0e2}
.btn.small{padding:8px 14px;font-size:14px;min-height:40px}
.btn:disabled{opacity:.45}
@media (hover:hover){.btn:not(:disabled):hover,.pick:hover,.trk:not(.lock):hover,.mode:hover{filter:brightness(1.12)}}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.mode{border:2px solid var(--line);border-radius:18px;padding:14px;text-align:left;min-height:92px;background:var(--panel);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.mode b{display:block;font-size:19px;margin:2px 0 4px}.mode small{display:block;color:var(--muted);font-size:12px;line-height:1.45}.mode .ic{font-size:26px}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin:8px 0}
.pick{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:6px;text-align:center}
.pick.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset,0 0 18px rgba(255,210,63,.5)}
.pick canvas{position:static;width:100%;max-width:110px;height:auto;aspect-ratio:11/9}
.pick b{display:block;font-size:14px}.pick small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.pick .price{color:var(--gold);font-weight:900;font-size:12px}
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:10px 0}
.trk{position:relative;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left;min-height:110px;overflow:hidden;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.55)}
.trk b{display:block;font-size:18px;margin:2px 0}.trk small{display:block;font-size:12px;opacity:.92}.trk .cup{font-size:20px;margin-top:6px}
.trk.lock{filter:grayscale(.8) brightness(.6)}
.stat{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;font-size:12px;color:var(--muted);align-items:center;max-width:420px;margin:8px auto}
.stat i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,#4dc3ff,#ffd23f)}.stat span.bg{display:block;background:rgba(0,0,0,.25);border-radius:4px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.4)}.sw.sel{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
#garageView{position:static;width:100%;max-width:420px;height:200px;display:block;margin:0 auto;border-radius:16px;background:radial-gradient(ellipse at 50% 70%,#2a6ad0,#0f2f6a)}
table{width:100%;border-collapse:collapse;margin:10px 0 16px;font-size:15px}
td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.12)}
tr.me td{background:rgba(255,210,63,.18);font-weight:900}
td.r{text-align:right;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:12px;text-align:center;line-height:1.7;margin-top:10px}
.trophy{font-size:72px;text-align:center;margin:0}
.hide{display:none!important}
#ctrl{position:fixed;inset:0;pointer-events:none;z-index:5}
#steerZone{position:absolute;left:0;bottom:0;width:50%;height:75%;pointer-events:auto;touch-action:none}
#ctrl .cb{pointer-events:auto;position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.6);color:#fff;font-weight:900;display:grid;place-items:center;line-height:1.05;text-shadow:0 2px 3px rgba(0,0,0,.35);
  background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.42),rgba(30,80,170,.42) 62%);box-shadow:0 6px 16px rgba(0,0,0,.28),inset 0 -5px 0 rgba(0,0,0,.18);backdrop-filter:blur(3px);transition:transform .06s}
#ctrl .cb.on{transform:scale(.92);filter:brightness(1.25)}
#bD{right:calc(var(--sr) + 18px);bottom:calc(var(--sb) + 18px);width:112px;height:112px;font-size:18px;background:radial-gradient(circle at 35% 28%,rgba(255,236,180,.7),rgba(255,110,40,.62) 62%)!important}
#bD small{display:block;font-size:11px;opacity:.85;font-weight:700}
#bI{right:calc(var(--sr) + 142px);bottom:calc(var(--sb) + 26px);width:80px;height:80px;font-size:34px}
#bI small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap}
#bB{right:calc(var(--sr) + 48px);bottom:calc(var(--sb) + 142px);width:58px;height:58px;font-size:13px}
#bP{right:calc(var(--sr) + 12px);top:calc(var(--st) + 10px);width:44px;height:44px;border-radius:14px!important;font-size:15px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#123a7a;z-index:20;font-size:18px}
</style>
</head>

<canvas id="gl"></canvas>

    <h1>团团卡丁车</h1>

    <div class="modes">
      <button class="mode" id="mGP"><span class="ic">🏆</span><b>杯赛</b><small>连跑 3 条赛道比积分，拿下奖杯</small></button>
      <button class="mode" id="mFree"><span class="ic">🏁</span><b>单场比赛</b><small>6 条赛道任你选，前三名解锁下一条</small></button>
      <button class="mode" id="mGarage"><span class="ic">🔧</span><b>车库</b><small>选车手、换车身、换轮胎、喷漆</small></button>
    </div>
    <div class="row" style="margin-top:4px"><button class="btn small" id="tMusic">音乐：开</button><button class="btn small" onclick="GameMusic.openPlaylist()">🎵 我的歌单</button><button class="btn small" id="tSfx">音效：开</button><button class="btn small" id="tQual">画质：高</button><button class="btn small free" id="tFree">🎁 免费全解锁</button></div>
    <p class="hint">手机横屏：左下 ◀ ▶ 转向；右下「漂移」按住转弯攒火花（蓝→橙→紫），松开加速；「道具」使用道具。<br>电脑：← → / A D 转向，空格 / Shift 漂移，E 道具，↓ 刹车，C 视角，P 暂停。<br>飞跃台腾空时按漂移键 = 空中特技，落地加速。倒数「1」快消失时按住漂移 = 火箭起步。</p>
  </div>
</div>

<div class="screen" id="garage" hidden>
  <div class="box">
    <div class="top"><span>车库</span><span>金币 <span class="coins" id="gCoins">0</span></span></div>
    <canvas id="garageView"></canvas>
    <div class="stat" id="gStats"></div>
    <h3>车手</h3><div class="chars" id="charList"></div>
    <h3>车身</h3><div class="chars" id="bodyList"></div>
    <h3>轮胎</h3><div class="chars" id="wheelList"></div>
    <h3>车漆</h3><div class="swatches" id="paintList"></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="gBack">完成</button></div>
  </div>
</div>

<div class="screen" id="trackSel" hidden>
  <div class="box">
    <h2 id="tsTitle">选择赛道</h2>
    <div class="tracks" id="trackList"></div>
    <div class="row"><button class="btn" id="tsBack">返回</button></div>
  </div>
</div>

<div class="screen dim" id="pause" hidden>
  <div class="box" style="max-width:420px">
    <h2>暂停</h2>
    <div class="row" style="flex-direction:column;align-items:stretch">
      <button class="btn primary" id="pResume">继续</button>
      <button class="btn" id="pCam">切换视角</button>
      <button class="btn" id="pRestart">重新开始</button>
      <button class="btn" id="pQuit">退出到菜单</button>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn small" id="tMusic2">音乐</button><button class="btn small" onclick="GameMusic.openPlaylist()">🎵 我的歌单</button><button class="btn small" id="tSfx2">音效</button></div>
  </div>
</div>

<div class="screen dim" id="result" hidden>
  <div class="box" style="max-width:560px">
    <p class="trophy hide" id="rTrophy">🏆</p>
    <h2 id="rTitle">冠军！</h2>
    <p class="sub" id="rSub"></p>
    <table id="rTable"></table>
    <div class="row">
      <button class="btn primary" id="rNext">下一条赛道</button>
      <button class="btn" id="rAgain">再跑一次</button>
      <button class="btn" id="rMenu">菜单</button>
    </div>
  </div>
</div>

  if(state==='count'){const n=Math.ceil(countT);if(n>=1&&n<=3){const f=countT%1;hx.font='italic 900 '+Math.round(120*ui*(0.8+f*0.4))+'px sans-serif';hx.lineWidth=10;hx.strokeStyle='#0b3a8a';hx.strokeText(n,W/2,H*0.36);hx.fillStyle=['#4dff88','#ffd23f','#ff4d6d'][n-1];hx.fillText(n,W/2,H*0.36)}
    hx.font='bold '+Math.round(15*ui)+'px sans-serif';hx.lineWidth=4;const t='「1」快消失时按住漂移 = 火箭起步';hx.strokeText(t,W/2,H*0.55);hx.fillStyle='#fff';hx.fillText(t,W/2,H*0.55)}
  let py=H*0.26;for(const p of pops){p.t-=dt;const a=clamp(Math.min(p.t*3,(p.max-p.t)*10),0,1);hx.globalAlpha=a;hx.font='italic 900 '+Math.round(30*ui)+'px sans-serif';hx.lineWidth=6;hx.strokeStyle='#0b3a8a';hx.strokeText(p.text,W/2,py);hx.fillStyle=p.color;hx.fillText(p.text,W/2,py);py+=38*ui}hx.globalAlpha=1;pops=pops.filter(p=>p.t>0);
  if(H>W*1.1){hx.font='14px sans-serif';hx.fillStyle='rgba(255,255,255,.8)';hx.fillText('📱 横过来玩效果更好',W/2,H*0.62)}
  if(isTouch){
    // 转向指示：按住时在手指处显示方向盘
    const cx=pad.on?pad.ox:Math.max(110,safeB+110),cy=pad.on?pad.oy:H-safeB-90;
    hx.globalAlpha=pad.on?0.9:0.5;hx.strokeStyle='rgba(255,255,255,.7)';hx.lineWidth=3;rbox(cx-80,cy-22,160,44,22);hx.stroke();hx.fillStyle='rgba(8,30,80,.3)';hx.fill();
    const kx=cx+clamp(pad.on?pad.x-pad.ox:0,-64,64);hx.fillStyle='#fff';hx.beginPath();hx.arc(kx,cy,18,0,TAU);hx.fill();
    hx.fillStyle='rgba(255,255,255,.8)';hx.font='bold 16px sans-serif';hx.textAlign='center';hx.textBaseline='middle';hx.fillText('◀',cx-58,cy);hx.fillText('▶',cx+58,cy);
    if(!pad.on&&raceT<8){hx.font='bold 12px sans-serif';hx.fillText('左半屏按住 左右滑动 转向',cx,cy-38)}
    hx.globalAlpha=1;
    const ic=me.items[0]?(me.rollT>0?'…':(me.items[0].id==='triple'?'🚀':ITEMS[me.items[0].id].icon)):'·';if(ic!==lastItemIcon){lastItemIcon=ic;$('bIicon').textContent=ic}
  }
}
let lastItemIcon='';

/* ============ 结算 / 杯赛 ============ */
function finishRace(){
  GameMusic.stop();
  setTimeout(()=>{
    state='over';stopEngine();$('ctrl').classList.add('hide');
    const rows=karts.map(k=>({k,t:k.finished?k.finishT:raceT+((LAPS+1)*N-k.prog)*ds/(VMAX*0.85)}));rows.sort((a,b)=>a.t-b.t);
    const pos=rows.findIndex(r=>r.k===me)+1;
    GameMusic.jingle('music/'+(pos===1?'j-best':pos<=3?'j-good':'j-bad')+'.m4a',0.9);
    setTimeout(()=>{if(state==='over')GameMusic.play('music/'+(pos===1?'result-best':pos<=3?'result-good':'result-bad')+'.m4a',{fade:0.5})},2600);
    for(let i=0;i<120;i++)emit(me.x+(Math.random()-0.5)*6,me.y+6+Math.random()*4,me.z+(Math.random()-0.5)*6,(Math.random()-0.5)*8,Math.random()*4,(Math.random()-0.5)*8,['#ff4d7e','#ffd23f','#45b8ff','#5fd068','#ffffff'][i%5],2.5,4);
    const tr=TRACKS[trackIdx],rec=save.tracks[tr.id]||(save.tracks[tr.id]={best:0,cup:0});
    const cup=pos===1?3:pos===2?2:pos===3?1:0;if(cup>rec.cup)rec.cup=cup;if(!rec.best||me.finishT<rec.best)rec.best=me.finishT;
    const earned=[0,120,90,70,50,40,35,30,25][pos]+me.coins*5;save.coins+=earned;persist();
    $('rTrophy').classList.add('hide');
    if(gp){
      rows.forEach((r,i)=>{gp.pts[r.k.ci]=(gp.pts[r.k.ci]||0)+POINTS[i]});
      const st=Object.entries(gp.pts).map(([ci,p])=>({ci:+ci,p})).sort((a,b)=>b.p-a.p);
      const last=gp.race>=2;
      $('rTitle').textContent=last?'杯赛结束':'第 '+(gp.race+1)+' 场：第 '+pos+' 名';
      if(last){const gpos=st.findIndex(s=>s.ci===save.char)+1;const cups=CUPS[gp.cup];const old=save.cups[cups.id]||0;const medal=gpos===1?3:gpos===2?2:gpos===3?1:0;if(medal>old)save.cups[cups.id]=medal;const bonus=[0,500,300,200][gpos]||80;save.coins+=bonus;persist();
        $('rTrophy').textContent=['🎗️','🏆','🥈','🥉'][gpos<=3?gpos:0];$('rTrophy').classList.remove('hide');$('rTitle').textContent=cups.name+(gpos===1?' 冠军！':gpos<=3?' 第 '+gpos+' 名！':' 第 '+gpos+' 名');$('rSub').textContent='杯赛奖金 +'+bonus+' 金币 · 本场 +'+earned+' 金币'}
      else $('rSub').textContent='本场 +'+earned+' 金币 · 积分榜：';
      $('rTable').innerHTML=st.map((s,i)=>'<tr class="'+(s.ci===save.char?'me':'')+'"><td>'+(i+1)+'</td><td>'+CHARS[s.ci].name+(s.ci===save.char?'（你）':'')+'</td><td class="r">'+s.p+' 分</td></tr>').join('');
      $('rNext').textContent=last?'返回菜单':'下一场';$('rNext').classList.remove('hide');$('rAgain').classList.toggle('hide',true);
    }else{
      $('rTitle').textContent=pos===1?'🏆 冠军！':pos<=3?'🥈 登上领奖台！':'第 '+pos+' 名，再接再厉';
      $('rSub').textContent='获得 '+earned+' 金币（名次 + 收集金币 ×5）';
      $('rTable').innerHTML=rows.map((r,i)=>'<tr class="'+(r.k===me?'me':'')+'"><td>'+(i<3?['🥇','🥈','🥉'][i]:i+1)+'</td><td>'+r.k.ch.name+(r.k===me?'（你）':'')+'</td><td class="r">'+fmt(r.t)+'</td></tr>').join('');
      $('rNext').textContent='下一条赛道';$('rNext').classList.toggle('hide',!(pos<=3&&trackIdx<TRACKS.length-1));$('rAgain').classList.remove('hide');
    }
    showScreen('result');
  },1600);
  pop('终点！','#ffd23f',1.4);
}

/* ============ 界面 ============ */
function showScreen(id){for(const s of['menu','garage','trackSel','pause','result'])$(s).hidden=s!==id}
function openMenu(){
  state='menu';gp=null;stopEngine();GameMusic.play('music/menu.m4a',{fade:0.6});$('ctrl').classList.add('hide');showScreen('menu');applyAudio();
  $('mCoins').textContent=save.coins;$('cupCount').textContent=Object.values(save.cups).filter(v=>v===3).length+Object.values(save.tracks).filter(t=>t.cup===3).length;
  $('tFree').textContent=save.unlockAll?'✓ 已全部解锁':'🎁 免费全解锁';
}
function openTracks(){
  showScreen('trackSel');$('tsTitle').textContent='选择赛道';const list=$('trackList');list.innerHTML='';
  TRACKS.forEach((tr,i)=>{
    const rec=save.tracks[tr.id]||{cup:0,best:0};const unlocked=save.unlockAll||i===0||(save.tracks[TRACKS[i-1].id]||{}).cup>0;
    const b=document.createElement('button');b.className='trk'+(unlocked?'':' lock');
    b.style.background='linear-gradient(180deg,'+tr.sky[0]+','+tr.sky[1]+' 55%,'+tr.ground+' 55%)';
    b.innerHTML='<small>第 '+(i+1)+' 站 · '+tr.laps+' 圈</small><b>'+(unlocked?'':'🔒 ')+tr.name+'</b><small>'+tr.desc+'</small><div class="cup">'+(['','🥉','🥈','🏆'][rec.cup]||'')+(rec.best?' <small style="display:inline">'+fmt(rec.best)+'</small>':'')+'</div>';
    b.onclick=()=>{sfx('click');if(!unlocked){b.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:220});return}gp=null;startRace(i)};
    list.appendChild(b);
  });
}
function openCups(){
  showScreen('trackSel');$('tsTitle').textContent='选择杯赛';const list=$('trackList');list.innerHTML='';
  CUPS.forEach((c,i)=>{const medal=save.cups[c.id]||0;const unlocked=save.unlockAll||i===0||(save.cups[CUPS[i-1].id]||0)>0;
    const b=document.createElement('button');b.className='trk'+(unlocked?'':' lock');const t0=TRACKS[c.tracks[0]],t2=TRACKS[c.tracks[2]];
    b.style.background='linear-gradient(135deg,'+t0.sky[0]+','+t2.sky[1]+')';
    b.innerHTML='<small>3 场积分赛</small><b>'+c.icon+' '+(unlocked?'':'🔒 ')+c.name+'</b><small>'+c.tracks.map(i=>TRACKS[i].name).join(' → ')+'</small><div class="cup">'+(['','🥉','🥈','🏆'][medal]||'')+'</div>';
    b.onclick=()=>{sfx('click');if(!unlocked){b.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:220});return}gp={cup:i,race:0,pts:{}};startRace(c.tracks[0])};
    list.appendChild(b)});
}
/* ---- 车库 ---- */
let gScene=null,gCam=null,gRen=null,gKart=null,gSpin=0;
function openGarage(){
  state='garage';showScreen('garage');$('gCoins').textContent=save.coins;
  if(!gRen){gRen=new THREE.WebGLRenderer({canvas:$('garageView'),antialias:true,alpha:true});gScene=new THREE.Scene();gScene.add(new THREE.HemisphereLight(0xffffff,0x334466,0.9));const dl=new THREE.DirectionalLight(0xffffff,0.7);dl.position.set(3,6,4);gScene.add(dl);gCam=new THREE.PerspectiveCamera(35,2,0.1,50);gCam.position.set(4.6,3,5.6);gCam.lookAt(0,0.9,0);const fl=new THREE.Mesh(new THREE.CircleGeometry(3,32),new THREE.MeshLambertMaterial({color:0x1d4fa3}));fl.rotation.x=-Math.PI/2;gScene.add(fl)}
  const cv=$('garageView');const w=cv.clientWidth||400,h=cv.clientHeight||200;gRen.setPixelRatio(Math.min(2,devicePixelRatio||1));gRen.setSize(w,h,false);gCam.aspect=w/h;gCam.updateProjectionMatrix();
  if(gKart)gScene.remove(gKart.group);const ch=CHARS[save.char];gKart=makeKart(ch,{body:save.body,wheel:save.wheel,paint:PAINTS[save.paint]||ch.kart,noScene:true});gScene.add(gKart.group);
  const st=kartStats(save.char,false);const bar=(n,v)=>'<span>'+n+'</span><span class="bg"><i style="width:'+clamp((v-0.85)/0.35,0.05,1)*100+'%"></i></span>';
  $('gStats').innerHTML=bar('极速',st.spd)+bar('加速',st.acc)+bar('操控',st.hdl)+bar('漂移',1+st.dc+st.mt*0.6)+bar('越野',0.9+st.off*0.4);
  const cl=$('charList');cl.innerHTML='';CHARS.forEach((c,i)=>{const b=document.createElement('button');b.className='pick'+(save.char===i?' sel':'');b.appendChild(portrait(c));b.insertAdjacentHTML('beforeend','<b>'+c.name+'</b><small>'+c.desc+'</small>');b.onclick=()=>{initAudio();sfx('click');save.char=i;persist();openGarage()};cl.appendChild(b)});
  const part=(listId,arr,kind,key)=>{const el=$(listId);el.innerHTML='';arr.forEach(p=>{const own=save.unlockAll||save.owned[p.id];const b=document.createElement('button');b.className='pick'+(save[key]===p.id?' sel':'');b.appendChild(partIcon(kind,p.id));b.insertAdjacentHTML('beforeend','<b>'+p.name+'</b><small>'+p.desc+'</small>'+(own?'':'<div class="price">🪙 '+p.cost+'</div>'));
    b.onclick=()=>{initAudio();if(!own){if(save.coins<p.cost){sfx('bump');b.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:220});return}save.coins-=p.cost;save.owned[p.id]=1;sfx('buy')}else sfx('click');save[key]=p.id;persist();openGarage()};el.appendChild(b)})};
  part('bodyList',BODIES,'body','body');part('wheelList',WHEELS,'wheel','wheel');
  const pl=$('paintList');pl.innerHTML='';PAINTS.forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(save.paint===i?' sel':'');b.style.background=c||'conic-gradient(#ff4d7e,#ffd23f,#45b8ff,#ff4d7e)';b.title=c?'':'车手默认色';b.onclick=()=>{sfx('click');save.paint=i;persist();openGarage()};pl.appendChild(b)});
}
function startRace(i){
  initAudio();mini=null;newRace(i);showScreen(null);$('result').hidden=true;$('ctrl').classList.remove('hide');
  for(const id of['steerZone','bD','bI','bB'])$(id).classList.toggle('hide',!isTouch);
  updateCamera(0,true);startEngine();setStartLights(4);GameMusic.stop();GameMusic.jingle('music/j-start.m4a',0.9);last=performance.now();
}
let pausedFrom='race';
function openPause(){if(state!=='race'&&state!=='count')return;pausedFrom=state;state='pause';stopEngine();GameMusic.pause();showScreen('pause');applyAudio()}
function resume(){showScreen(null);state=pausedFrom;startEngine();GameMusic.resume();last=performance.now()}
$('mFree').onclick=()=>{initAudio();sfx('click');openTracks()};$('mGP').onclick=()=>{initAudio();sfx('click');openCups()};$('mGarage').onclick=()=>{initAudio();sfx('click');openGarage()};
$('gBack').onclick=()=>openMenu();$('tsBack').onclick=()=>openMenu();
$('pResume').onclick=resume;$('pRestart').onclick=()=>{if(gp)gp.pts=gp.ptsBefore||gp.pts;startRace(trackIdx)};$('pQuit').onclick=()=>openMenu();
$('rAgain').onclick=()=>startRace(trackIdx);$('rMenu').onclick=()=>openMenu();
$('rNext').onclick=()=>{if(gp){if(gp.race>=2){openMenu();return}gp.race++;gp.ptsBefore=Object.assign({},gp.pts);startRace(CUPS[gp.cup].tracks[gp.race])}else startRace(trackIdx+1)};
function tog(k){initAudio();save[k]=save[k]?0:1;persist();applyAudio()}
$('tMusic').onclick=$('tMusic2').onclick=()=>tog('music');$('tSfx').onclick=$('tSfx2').onclick=()=>tog('sfx');
$('tQual').onclick=()=>{tog('hq');resize()};
$('tFree').onclick=()=>{initAudio();save.unlockAll=1;for(const p of[...BODIES,...WHEELS])save.owned[p.id]=1;save.coins=Math.max(save.coins,9999);persist();sfx('buy');openMenu()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)openPause();else if(state==='menu'||state==='over'||state==='garage')GameMusic.resume()});

/* ============ 主循环 ============ */
let last=performance.now(),menuSpin=0,worldT=0;
buildTrack(TRACKS[0]);
let demo=makeKart(CHARS[save.char],{body:save.body,wheel:save.wheel,paint:PAINTS[save.paint]||CHARS[save.char].kart});let demoKey='';
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;worldT+=dt;
  if(state==='count'||state==='race'){const h=dt/2;updateRace(h);updateRace(h);updateCamera(dt);setEngine(Math.abs(me.v)/VMAX,me.boostT>0,me.drift?(me.dT>1.5?2:1):0)}
  else if(state==='menu'||state==='garage'){
    const key=save.char+save.body+save.wheel+save.paint;if(demoKey!==key){scene.remove(demo.group);demo=makeKart(CHARS[save.char],{body:save.body,wheel:save.wheel,paint:PAINTS[save.paint]||CHARS[save.char].kart});demoKey=key}
    if(TR!==TRACKS[0]&&state==='menu'){}
    menuSpin+=dt*0.15;const c=P[0];demo.group.visible=true;demo.group.position.copy(c);demo.group.rotation.y=Math.atan2(T[0].x,T[0].z);
    camera.position.set(c.x+Math.sin(menuSpin)*14,c.y+6,c.z+Math.cos(menuSpin)*14);camera.lookAt(c.x,c.y+1,c.z);sun.position.set(c.x+40,80,c.z+30);sun.target.position.copy(c);
    if(state==='garage'&&gKart){gSpin+=dt*0.6;gKart.group.rotation.y=gSpin;gRen.render(gScene,gCam)}
  }
  if(state!=='menu'&&state!=='garage')demo.group.visible=false;
  updateWorldAnim(dt,worldT);
  updateParts(dt);
  renderer.render(scene,camera);
  drawHUD(dt);
  requestAnimationFrame(frame);
}
openMenu();requestAnimationFrame(frame);
</script>
