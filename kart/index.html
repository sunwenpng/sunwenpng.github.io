<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1d6fd8">
<title>团团卡丁车</title>
<meta name="description" content="原创 3D 卡丁车：8 位萌系车手、4 条赛道、漂移攒加速、道具箱、AI 对手。">
<style>
:root{--bg:#123a7a;--panel:#163f86;--panel2:#1d4fa3;--line:rgba(255,255,255,.22);--fg:#fff;--muted:#cfe0ff;--gold:#ffd23f;--pink:#ff6fa5;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{pointer-events:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#probe{position:fixed;visibility:hidden;pointer-events:none;inset:0;padding:var(--st) var(--sr) var(--sb) var(--sl)}
.screen{position:fixed;inset:0;display:flex;padding:calc(var(--st) + 14px) max(16px,var(--sr)) calc(var(--sb) + 14px) max(16px,var(--sl));background:radial-gradient(ellipse at 50% 0,rgba(80,170,255,.55),rgba(10,40,100,.9) 70%);z-index:10;overflow:auto}
.screen.dim{background:rgba(8,24,60,.72);backdrop-filter:blur(3px)}
.screen[hidden]{display:none}
.box{width:100%;max-width:820px;margin:auto}
h1{margin:0;text-align:center;font-size:clamp(38px,9vw,64px);font-weight:900;letter-spacing:.04em;color:#fff;-webkit-text-stroke:2px #0b3a8a;text-shadow:0 5px 0 #ff6fa5,0 10px 0 #0b3a8a}
h2{margin:0 0 10px;text-align:center;font-size:26px;font-weight:900;text-shadow:0 3px 0 #0b3a8a}
.sub{color:var(--muted);text-align:center;font-size:13px;margin:10px 0 14px;line-height:1.6}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:6px}
.top a{color:var(--muted);text-decoration:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:2px solid rgba(255,255,255,.35);background:var(--panel2);border-radius:16px;padding:12px 20px;font-size:17px;font-weight:900;min-height:50px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn.primary{background:linear-gradient(180deg,#ffdd4a,#ff9d1c);color:#4a2500;border-color:#fff3b0}
.btn.free{background:linear-gradient(180deg,#ff8fbd,#e0457b);border-color:#ffd0e2}
.btn.small{padding:8px 14px;font-size:14px;min-height:40px}
@media (hover:hover){.btn:hover,.pick:hover,.trk:not(.lock):hover{filter:brightness(1.12)}}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.pick{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:8px;text-align:center}
.pick.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset,0 0 18px rgba(255,210,63,.5)}
.pick canvas{position:static;width:110px;height:90px}
.pick b{display:block;font-size:15px}
.pick small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:10px 0}
.trk{position:relative;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left;min-height:110px;overflow:hidden;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.5)}
.trk b{display:block;font-size:18px;margin:2px 0}
.trk small{display:block;font-size:12px;opacity:.9}
.trk .cup{font-size:20px;margin-top:6px}
.trk.lock{filter:grayscale(.8) brightness(.6)}
table{width:100%;border-collapse:collapse;margin:10px 0 16px;font-size:15px}
td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.12)}
tr.me td{background:rgba(255,210,63,.18);font-weight:900}
td.r{text-align:right;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:12px;text-align:center;line-height:1.7;margin-top:10px}
.hide{display:none!important}
#ctrl{position:fixed;inset:0;pointer-events:none;z-index:5}
#ctrl button{pointer-events:auto;position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.45);background:rgba(10,40,100,.38);font-weight:900;color:#fff;backdrop-filter:blur(2px)}
#ctrl button.on{background:rgba(255,255,255,.35)}
#bL{left:calc(var(--sl) + 14px);bottom:calc(var(--sb) + 16px);width:86px;height:86px;font-size:30px}
#bR{left:calc(var(--sl) + 112px);bottom:calc(var(--sb) + 16px);width:86px;height:86px;font-size:30px}
#bD{right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 16px);width:100px;height:100px;font-size:18px;background:rgba(255,120,40,.45)!important}
#bI{right:calc(var(--sr) + 124px);bottom:calc(var(--sb) + 30px);width:72px;height:72px;font-size:15px}
#bB{right:calc(var(--sr) + 40px);bottom:calc(var(--sb) + 128px);width:56px;height:56px;font-size:13px}
#bP{right:calc(var(--sr) + 12px);top:calc(var(--st) + 10px);width:44px!important;height:44px!important;border-radius:12px!important;font-size:15px}
#bM{right:calc(var(--sr) + 64px);top:calc(var(--st) + 10px);width:44px!important;height:44px!important;border-radius:12px!important;font-size:15px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#123a7a;z-index:20;font-size:18px}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="loading">加载中…</div>
<div id="ctrl" class="hide">
  <button id="bL" aria-label="左">◀</button>
  <button id="bR" aria-label="右">▶</button>
  <button id="bD" aria-label="漂移">漂移</button>
  <button id="bI" aria-label="道具">道具</button>
  <button id="bB" aria-label="刹车">刹车</button>
  <button id="bM" aria-label="视角">视角</button>
  <button id="bP" aria-label="暂停">II</button>
</div>

<div class="screen" id="menu">
  <div class="box">
    <div class="top"><a href="../">← 游戏大厅</a><span id="cupCount"></span></div>
    <h1>团团卡丁车</h1>
    <p class="sub">漂移攒火花，松手就加速！撞开道具箱，用火箭、追踪星、果冻陷阱和泡泡护盾抢第一。</p>
    <div class="chars" id="charList"></div>
    <div class="row"><button class="btn primary" id="btnGo" style="min-width:200px">选赛道出发</button></div>
    <div class="row" style="margin-top:10px"><button class="btn small" id="tMusic">音乐：开</button><button class="btn small" id="tSfx">音效：开</button><button class="btn small" id="tQual">画质：高</button><button class="btn small free" id="tFree">🎁 免费全解锁</button></div>
    <p class="hint">手机横屏：左下 ◀ ▶ 转向，右下「漂移」按住转弯攒火花（蓝→橙→紫），松开加速；「道具」使用道具。<br>电脑：← → / A D 转向，空格 或 Shift 漂移，E 道具，↓ 刹车，C 切换视角，P 暂停。<br>倒数「1」消失的瞬间按住漂移键 = 火箭起步。</p>
  </div>
</div>

<div class="screen" id="trackSel" hidden>
  <div class="box">
    <h2>选择赛道</h2>
    <div class="tracks" id="trackList"></div>
    <div class="row"><button class="btn" id="tsBack">返回</button></div>
  </div>
</div>

<div class="screen dim" id="pause" hidden>
  <div class="box" style="max-width:420px">
    <h2>暂停</h2>
    <div class="row" style="flex-direction:column;align-items:stretch">
      <button class="btn primary" id="pResume">继续</button>
      <button class="btn" id="pRestart">重新开始</button>
      <button class="btn" id="pQuit">退出到菜单</button>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn small" id="tMusic2">音乐</button><button class="btn small" id="tSfx2">音效</button></div>
  </div>
</div>

<div class="screen dim" id="result" hidden>
  <div class="box" style="max-width:520px">
    <h2 id="rTitle">冠军！</h2>
    <table id="rTable"></table>
    <div class="row">
      <button class="btn primary" id="rNext">下一条赛道</button>
      <button class="btn" id="rAgain">再跑一次</button>
      <button class="btn" id="rMenu">菜单</button>
    </div>
  </div>
</div>

<script src="../lib/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const wrapA=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a};
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
if(!window.THREE){$('loading').textContent='3D 引擎加载失败，请刷新重试';throw new Error('no three')}
$('loading').remove();

/* ============ 存档 ============ */
const SKEY='dango-kart-v1';
let save=(()=>{try{const s=JSON.parse(localStorage.getItem(SKEY));if(s)return Object.assign({char:0,tracks:{},music:1,sfx:1,hq:1,unlockAll:0,cam:0},s)}catch(e){}return{char:0,tracks:{},music:1,sfx:1,hq:isTouch?0:1,unlockAll:0,cam:0}})();
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save))}catch(e){}}

/* ============ 数据 ============ */
const CHARS=[
  {name:'团团',color:'#ffb3c7',kart:'#ff4d7e',ears:'none',spd:1.00,acc:1.00,hdl:1.00,desc:'全能均衡'},
  {name:'可可熊',color:'#b07a4f',kart:'#e8742c',ears:'round',spd:1.04,acc:0.94,hdl:0.96,desc:'速度型'},
  {name:'喵小橘',color:'#ffad5c',kart:'#ffcf3f',ears:'cat',spd:0.98,acc:1.08,hdl:1.02,desc:'加速快'},
  {name:'波波企鹅',color:'#3a4a66',kart:'#45b8ff',ears:'penguin',spd:0.97,acc:1.00,hdl:1.10,desc:'转向灵活'},
  {name:'阿飞狐',color:'#ff7a3c',kart:'#c43bff',ears:'fox',spd:1.05,acc:0.98,hdl:0.94,desc:'极速最高'},
  {name:'丁丁龙',color:'#5fd068',kart:'#2fbf8f',ears:'horn',spd:1.03,acc:0.97,hdl:0.98,desc:'重型稳健'},
  {name:'雪团兔',color:'#f4f4ff',kart:'#8f7bff',ears:'bunny',spd:0.97,acc:1.07,hdl:1.06,desc:'起步和弯道'},
  {name:'呱呱蛙',color:'#8fdc4a',kart:'#ff5a4e',ears:'frog',spd:1.00,acc:1.03,hdl:1.02,desc:'稳定好上手'},
];
const TRACKS=[
  {id:'meadow',name:'青草环道',desc:'新手赛道，宽阔弯道',scale:1,skill:0.88,pts:[[0,0,0],[70,-5,0],[125,15,1],[140,70,3],[115,120,5],[60,125,4],[25,160,2],[-35,165,1],[-85,130,0],[-100,70,2],[-75,20,1]],
    sky:0x7ec8ff,fog:0xbfe4ff,ground:0x5cc45a,ground2:0x4fb04e,wall:'#ffffff',wall2:'#ff4d5e',deco:'tree',night:0},
  {id:'beach',name:'椰风海湾',desc:'连续 S 弯，沙滩与海',scale:1,skill:0.92,pts:[[0,0,0],[90,-15,0],[160,10,0],[180,80,2],[140,130,4],[80,105,3],[40,140,1],[-20,190,0],[-95,175,2],[-130,110,4],[-95,60,2],[-110,10,0],[-60,-25,0]],
    sky:0x5ec4ff,fog:0xc8ecff,ground:0xf0d48a,ground2:0xe6c878,wall:'#ffffff',wall2:'#2fa8ff',deco:'palm',night:0,sea:1},
  {id:'snow',name:'雪山回廊',desc:'大落差与急弯',scale:1.4,laps:2,skill:0.95,pts:[[0,0,0],[80,0,4],[140,30,9],[150,95,14],[95,110,12],[60,80,8],[20,110,6],[40,170,10],[-30,200,14],[-110,170,10],[-120,90,6],[-70,60,3],[-90,10,1],[-45,-20,0]],
    sky:0xa9c8ea,fog:0xe4eef8,ground:0xf4f8ff,ground2:0xe6eef8,wall:'#ffffff',wall2:'#3a7bff',deco:'pine',night:0,snow:1},
  {id:'galaxy',name:'星河彩虹道',desc:'夜空中的彩虹赛道',scale:1.6,laps:2,skill:0.98,pts:[[0,0,0],[70,-20,3],[140,0,8],[160,60,12],[110,90,10],[150,140,6],[100,190,9],[20,175,14],[-10,120,10],[-60,160,6],[-130,130,4],[-140,60,8],[-90,30,5],[-70,-30,2]],
    sky:0x0a0a2a,fog:0x16163e,ground:0x0d0d2e,ground2:0x0d0d2e,wall:'#ff6fd8',wall2:'#6fe8ff',deco:'crystal',night:1,rainbow:1},
];
let LAPS=3;const HW=8,WALL=HW+2.8,N=1000;
const ITEMS={rocket:{icon:'🚀',name:'火箭'},star:{icon:'⭐',name:'追踪星'},jelly:{icon:'🍮',name:'果冻陷阱'},shield:{icon:'🫧',name:'泡泡护盾'},triple:{icon:'🚀×3',name:'三连火箭'}};

/* ============ 渲染器 ============ */
const glc=$('gl'),hud=$('hud'),hx=hud.getContext('2d');
const renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true,powerPreference:'high-performance'});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
let W=0,H=0,DPR=1,safeT=0,safeB=0;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,1,0.3,900);
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(save.hq?2:1.25,devicePixelRatio||1);
  renderer.setPixelRatio(DPR);renderer.setSize(W,H,false);camera.aspect=W/H;
  camera.fov=W<H?88:70;camera.updateProjectionMatrix();
  hud.width=Math.round(W*Math.min(2,devicePixelRatio||1));hud.height=Math.round(H*Math.min(2,devicePixelRatio||1));
  const cs=getComputedStyle($('probe'));safeT=parseFloat(cs.paddingTop)||0;safeB=parseFloat(cs.paddingBottom)||0;
}
addEventListener('resize',resize);resize();
const hemi=new THREE.HemisphereLight(0xffffff,0x557744,0.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.85);sun.position.set(40,80,30);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);const sc=sun.shadow.camera;sc.left=-40;sc.right=40;sc.top=40;sc.bottom=-40;sc.near=1;sc.far=200;sun.shadow.bias=-0.0008;
scene.add(sun);scene.add(sun.target);

/* ============ 纹理 ============ */
function canvasTex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping}t.anisotropy=4;return t}
function roadTex(tr){return canvasTex(256,256,(g,w,h)=>{
  if(tr.rainbow){const cols=['#ff4d6d','#ff9f1c','#ffe14d','#4dff88','#4dc3ff','#8a5cff'];for(let i=0;i<6;i++){g.fillStyle=cols[i];g.fillRect(i*w/6,0,w/6+1,h)}g.globalAlpha=.25;g.fillStyle='#fff';for(let y=0;y<h;y+=32)g.fillRect(0,y,w,4);g.globalAlpha=1;return}
  g.fillStyle='#5b5f68';g.fillRect(0,0,w,h);for(let i=0;i<1600;i++){g.fillStyle='rgba('+(Math.random()<.5?'255,255,255':'0,0,0')+','+Math.random()*0.08+')';g.fillRect(Math.random()*w,Math.random()*h,2,2)}
  g.fillStyle='#fff';g.fillRect(6,0,8,h);g.fillRect(w-14,0,8,h);g.fillStyle='rgba(255,255,255,.85)';g.fillRect(w/2-4,0,8,h/2);
},true)}
function curbTex(a,b){return canvasTex(64,64,(g,w,h)=>{g.fillStyle=a;g.fillRect(0,0,w,h);g.fillStyle=b;g.fillRect(0,0,w,h/2)},true)}
const boxTex=canvasTex(128,128,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#ff6fd8');gr.addColorStop(.5,'#ffd23f');gr.addColorStop(1,'#4dc3ff');g.fillStyle=gr;g.fillRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(8,8,w-16,h-16);g.fillStyle='#fff';g.font='bold 92px sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineWidth=8;g.strokeStyle='#c43bff';g.strokeText('?',w/2,h/2+6);g.fillText('?',w/2,h/2+6)});
const checkTex=canvasTex(64,64,(g,w,h)=>{for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.fillStyle=(x+y)%2?'#111':'#fff';g.fillRect(x*16,y*16,16,16)}},true);
const padTex=canvasTex(128,128,(g,w,h)=>{g.fillStyle='#ff9d1c';g.fillRect(0,0,w,h);g.fillStyle='#fff36b';for(let k=0;k<3;k++){const y=100-k*36;g.beginPath();g.moveTo(20,y);g.lineTo(64,y-30);g.lineTo(108,y);g.lineTo(108,y+12);g.lineTo(64,y-18);g.lineTo(20,y+12);g.fill()}});
const dotTex=canvasTex(64,64,(g,w,h)=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.8)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,w,h)});

/* ============ 赛道 ============ */
let TR=null,P=[],T=[],R=[],trackGroup=null,trackLen=0,ds=1;
function buildTrack(tr){
  if(trackGroup){scene.remove(trackGroup);trackGroup.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
  TR=tr;trackGroup=new THREE.Group();scene.add(trackGroup);
  scene.background=new THREE.Color(tr.sky);scene.fog=new THREE.Fog(tr.fog,120,tr.night?380:520);
  hemi.color.set(tr.night?0x8888ff:0xffffff);hemi.groundColor.set(tr.night?0x221144:0x557744);hemi.intensity=tr.night?0.6:0.75;sun.intensity=tr.night?0.45:0.85;
  const curve=new THREE.CatmullRomCurve3(tr.pts.map(p=>new THREE.Vector3(p[0]*tr.scale,p[2]*tr.scale*0.8,p[1]*tr.scale)),true,'centripetal');
  P=curve.getSpacedPoints(N).slice(0,N);trackLen=curve.getLength();ds=trackLen/N;
  T=[];R=[];
  for(let i=0;i<N;i++){const a=P[(i-1+N)%N],b=P[(i+1)%N];const t=new THREE.Vector3().subVectors(b,a).normalize();T.push(t);const f=new THREE.Vector3(t.x,0,t.z).normalize();R.push(new THREE.Vector3(-f.z,0,f.x))}
  // 路面
  const strip=(off0,off1,y0,y1,mat,vScale,skirt)=>{
    const pos=[],uv=[],idx=[];let v=0;
    for(let i=0;i<=N;i++){const k=i%N,p=P[k],r=R[k];
      pos.push(p.x+r.x*off0,p.y+y0,p.z+r.z*off0,p.x+r.x*off1,p.y+y1,p.z+r.z*off1);uv.push(0,v,1,v);v+=ds/vScale;
      if(i<N){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3)}}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
    const m=new THREE.Mesh(g,mat);m.receiveShadow=true;trackGroup.add(m);return m;
  };
  const rt=roadTex(tr);
  strip(-HW,HW,0.05,0.05,new THREE.MeshLambertMaterial({map:rt,side:THREE.DoubleSide,emissive:tr.rainbow?0x222222:0}),tr.rainbow?6:16);
  const ct=curbTex(tr.wall,tr.wall2);
  strip(-HW-1.4,-HW,0.08,0.08,new THREE.MeshLambertMaterial({map:ct,side:THREE.DoubleSide}),3);
  strip(HW,HW+1.4,0.08,0.08,new THREE.MeshLambertMaterial({map:ct,side:THREE.DoubleSide}),3);
  // 路肩（草地 / 沙地）

  }
  for(const p of projs)if(p.dead)scene.remove(p.mesh);projs=projs.filter(p=>!p.dead);
  for(const h of hazards){h.t+=dt;h.mesh.scale.y=1+Math.sin(raceT*5+h.x)*0.12}hazards=hazards.filter(h=>!h.dead);
  for(const b of boxes){if(b.t>0){b.t-=dt;if(b.t<=0)b.mesh.visible=true}b.mesh.rotation.y+=dt*1.5;b.mesh.rotation.x=Math.sin(raceT+b.i)*0.3;b.mesh.position.y=b.pos.y+1.3+Math.sin(raceT*2+b.lat)*0.25}
  // 名次
  const order=[...karts].sort((a,b)=>(b.finished?1e9-b.finishT*1000:b.prog+((b.x-P[b.idx].x)*T[b.idx].x+(b.z-P[b.idx].z)*T[b.idx].z)/ds)-(a.finished?1e9-a.finishT*1000:a.prog+((a.x-P[a.idx].x)*T[a.idx].x+(a.z-P[a.idx].z)*T[a.idx].z)/ds));
  order.forEach((k,i)=>k.rank=i+1);
}
/* ============ 镜头 ============ */
const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();
function updateCamera(dt,snap){
  if(!me)return;const fx=Math.sin(me.th+me.slip*0.5),fz=Math.cos(me.th+me.slip*0.5);
  const[back,up,ahead]=[[7.2,3.3,5],[11,5.4,7],[4.6,2.3,4]][camMode];
  const tx=me.x-fx*back,tz=me.z-fz*back,ty=me.y+up+me.hopY*0.5;
  if(snap){camPos.set(tx,ty,tz);camLook.set(me.x+fx*ahead,me.y+1,me.z+fz*ahead)}
  camPos.x=lerp(camPos.x,tx,Math.min(1,dt*6));camPos.z=lerp(camPos.z,tz,Math.min(1,dt*6));camPos.y=lerp(camPos.y,ty,Math.min(1,dt*4));
  camLook.lerp(new THREE.Vector3(me.x+fx*ahead,me.y+1.2,me.z+fz*ahead),Math.min(1,dt*10));
  camera.position.copy(camPos);
  if(me.bump>0){me.bump-=dt;camera.position.x+=(Math.random()-0.5)*0.4;camera.position.y+=(Math.random()-0.5)*0.3}
  camera.lookAt(camLook);
  const fov=(W<H?88:70)+(me.boostT>0?10:0)+me.v/VMAX*4;camera.fov=lerp(camera.fov,fov,Math.min(1,dt*4));camera.updateProjectionMatrix();
  sun.position.set(me.x+40,me.y+80,me.z+30);sun.target.position.set(me.x,me.y,me.z);
}

/* ============ HUD ============ */
const ORD=['','1st','2nd','3rd','4th','5th','6th','7th','8th'];
function fmt(t){const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2)}
let mini=null;
function drawHUD(dt){
  const s=hud.width/W;hx.setTransform(s,0,0,s,0,0);hx.clearRect(0,0,W,H);
  if(!me||state==='menu')return;
  const ui=clamp(Math.min(W,H)/400,0.8,1.4),top=safeT+10;
  // 名次
  hx.textBaseline='top';hx.textAlign='right';
  const rk=me.rank;hx.font='italic 900 '+Math.round(54*ui)+'px sans-serif';hx.lineWidth=7;hx.strokeStyle='#0b3a8a';
  const rx=W-(isTouch?120:20);hx.strokeText(ORD[rk],rx,top);hx.fillStyle=rk===1?'#ffd23f':rk<=3?'#ffffff':'#cfe0ff';hx.fillText(ORD[rk],rx,top);
  hx.font='bold '+Math.round(16*ui)+'px sans-serif';hx.lineWidth=4;const lt='圈 '+Math.min(LAPS,Math.max(1,me.lap))+'/'+LAPS+'  '+fmt(raceT);hx.strokeText(lt,rx,top+58*ui);hx.fillStyle='#fff';hx.fillText(lt,rx,top+58*ui);
  // 道具框
  const bx=16,by=top,bs=Math.round(64*ui);hx.fillStyle='rgba(10,40,100,.55)';hx.strokeStyle='#fff';hx.lineWidth=3;hx.beginPath();hx.roundRect?hx.roundRect(bx,by,bs,bs,14):hx.rect(bx,by,bs,bs);hx.fill();hx.stroke();
  hx.textAlign='center';hx.textBaseline='middle';
  if(me.rollT>0){const ks=Object.keys(ITEMS);hx.font=Math.round(36*ui)+'px sans-serif';hx.fillText(ITEMS[ks[Math.floor(raceT*14)%ks.length]].icon,bx+bs/2,by+bs/2+2)}
  else if(me.item){hx.font=Math.round((me.item==='triple'?26:38)*ui)+'px sans-serif';hx.fillStyle='#fff';hx.fillText(me.item==='triple'?'🚀×'+me.itemN:ITEMS[me.item].icon,bx+bs/2,by+bs/2+2);hx.font='bold '+Math.round(11*ui)+'px sans-serif';hx.fillText(isTouch?'点「道具」':'E 使用',bx+bs/2,by+bs+10)}
  // 小地图
  if(!mini){let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;for(const p of P){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);z0=Math.min(z0,p.z);z1=Math.max(z1,p.z)}mini={x0,x1,z0,z1}}
  const ms=Math.round(110*ui),mx=16,my=by+bs+26*ui,k=ms/Math.max(mini.x1-mini.x0,mini.z1-mini.z0);
  const mp=(x,z)=>[mx+ms-(x-mini.x0)*k,my+(z-mini.z0)*k];
  hx.lineWidth=5;hx.strokeStyle='rgba(0,0,0,.35)';hx.beginPath();for(let i=0;i<=N;i+=8){const[a,b]=mp(P[i%N].x,P[i%N].z);i?hx.lineTo(a,b):hx.moveTo(a,b)}hx.stroke();
  hx.lineWidth=2.5;hx.strokeStyle='#fff';hx.stroke();
  for(const kk of karts){const[a,b]=mp(kk.x,kk.z);hx.fillStyle=kk.ch.kart;hx.beginPath();hx.arc(a,b,kk===me?5.5:3.5,0,TAU);hx.fill();if(kk===me){hx.strokeStyle='#fff';hx.lineWidth=2;hx.stroke()}}
  // 速度 & 漂移等级
  const kmh=Math.round(Math.abs(me.v)*3.6*1.4);hx.textAlign='center';hx.textBaseline='bottom';
  const sx=W/2,sy=H-safeB-14;hx.font='italic 900 '+Math.round(34*ui)+'px sans-serif';hx.lineWidth=6;hx.strokeStyle='#0b3a8a';hx.strokeText(kmh,sx,sy-14*ui);hx.fillStyle=me.boostT>0?'#66d9ff':'#fff';hx.fillText(kmh,sx,sy-14*ui);
  hx.font='bold '+Math.round(11*ui)+'px sans-serif';hx.fillStyle='#cfe0ff';hx.fillText('km/h',sx,sy);
  if(me.drift){const lv=me.dT>2.4?3:me.dT>1.5?2:me.dT>0.75?1:0;const w=150*ui;hx.fillStyle='rgba(0,0,0,.35)';hx.fillRect(sx-w/2,sy-64*ui,w,10);const f=Math.min(1,me.dT/2.4);hx.fillStyle=['#fff6c0','#4dc3ff','#ff9d1c','#c77dff'][lv];hx.fillRect(sx-w/2,sy-64*ui,w*f,10);for(const m of[0.75,1.5])hx.fillRect(sx-w/2+w*m/2.4-1,sy-68*ui,2,18)}
  // 倒数
  hx.textBaseline='middle';
  if(state==='count'){const n=Math.ceil(countT);if(n>=1&&n<=3){const f=countT%1;hx.font='italic 900 '+Math.round(120*ui*(0.8+f*0.4))+'px sans-serif';hx.lineWidth=10;hx.strokeStyle='#0b3a8a';hx.strokeText(n,W/2,H*0.36);hx.fillStyle=['#4dff88','#ffd23f','#ff4d6d'][n-1];hx.fillText(n,W/2,H*0.36)}
    hx.font='bold '+Math.round(15*ui)+'px sans-serif';hx.lineWidth=4;const t='「1」快消失时按住漂移 = 火箭起步';hx.strokeText(t,W/2,H*0.55);hx.fillStyle='#fff';hx.fillText(t,W/2,H*0.55)}
  let py=H*0.26;for(const p of pops){p.t-=dt;const a=clamp(Math.min(p.t*3,(p.max-p.t)*10),0,1);hx.globalAlpha=a;hx.font='italic 900 '+Math.round(30*ui)+'px sans-serif';hx.lineWidth=6;hx.strokeStyle='#0b3a8a';hx.strokeText(p.text,W/2,py);hx.fillStyle=p.color;hx.fillText(p.text,W/2,py);py+=38*ui}hx.globalAlpha=1;pops=pops.filter(p=>p.t>0);
  if(me.lap>LAPS-1&&me.lap<=LAPS&&state==='race'){}
  if(H>W*1.1){hx.font='14px sans-serif';hx.fillStyle='rgba(255,255,255,.8)';hx.fillText('📱 横过来玩效果更好',W/2,H*0.62)}
}

/* ============ 结算 ============ */
function finishRace(){
  setTimeout(()=>{
    state='over';stopEngine();stopMusic();$('ctrl').classList.add('hide');
    // 估算未完赛 AI 的成绩
    const avg=trackLen*LAPS/Math.max(1,raceT);
    const rows=karts.map(k=>({k,t:k.finished?k.finishT:raceT+((LAPS+1)*N-k.prog)*ds/(VMAX*0.85)}));rows.sort((a,b)=>a.t-b.t);
    const pos=rows.findIndex(r=>r.k===me)+1;
    const rec=save.tracks[TRACKS[trackIdx].id]||(save.tracks[TRACKS[trackIdx].id]={best:0,cup:0});
    const cup=pos===1?3:pos===2?2:pos===3?1:0;if(cup>rec.cup)rec.cup=cup;if(!rec.best||me.finishT<rec.best)rec.best=me.finishT;persist();
    $('rTitle').textContent=pos===1?'🏆 冠军！':pos<=3?'🥈 登上领奖台！':'第 '+pos+' 名，再接再厉';
    $('rTable').innerHTML=rows.map((r,i)=>'<tr class="'+(r.k===me?'me':'')+'"><td>'+(i<3?['🥇','🥈','🥉'][i]:i+1)+'</td><td>'+r.k.ch.name+(r.k===me?'（你）':'')+'</td><td class="r">'+fmt(r.t)+'</td></tr>').join('');
    $('rNext').classList.toggle('hide',!(pos<=3&&trackIdx<TRACKS.length-1));
    $('result').hidden=false;sfx(pos<=3?'win':'lose');
  },1200);
  pop('终点！','#ffd23f',1.4);
}

/* ============ 界面 ============ */
function showScreen(id){for(const s of['menu','trackSel','pause','result'])$(s).hidden=s!==id}
function openMenu(){
  state='menu';stopEngine();stopMusic();$('ctrl').classList.add('hide');showScreen('menu');applyAudio();
  const list=$('charList');list.innerHTML='';
  CHARS.forEach((ch,i)=>{const b=document.createElement('button');b.className='pick'+(save.char===i?' sel':'');b.appendChild(portrait(ch));b.insertAdjacentHTML('beforeend','<b>'+ch.name+'</b><small>'+ch.desc+'</small>');b.onclick=()=>{initAudio();sfx('click');save.char=i;persist();openMenu()};list.appendChild(b)});
  const cups=Object.values(save.tracks).filter(t=>t.cup===3).length;$('cupCount').textContent='🏆 '+cups+' / '+TRACKS.length;
}
function openTracks(){
  showScreen('trackSel');const list=$('trackList');list.innerHTML='';
  TRACKS.forEach((tr,i)=>{
    const rec=save.tracks[tr.id]||{cup:0,best:0};const unlocked=save.unlockAll||i===0||(save.tracks[TRACKS[i-1].id]||{}).cup>0;
    const b=document.createElement('button');b.className='trk'+(unlocked?'':' lock');
    const c1='#'+new THREE.Color(tr.sky).getHexString(),c2='#'+new THREE.Color(tr.ground).getHexString();
    b.style.background='linear-gradient(180deg,'+c1+' 0 55%,'+c2+' 55%)';
    b.innerHTML='<small>第 '+(i+1)+' 站</small><b>'+(unlocked?'':'🔒 ')+tr.name+'</b><small>'+tr.desc+'</small><div class="cup">'+(['','🥉','🥈','🏆'][rec.cup]||'')+(rec.best?' <small style="display:inline">'+fmt(rec.best)+'</small>':'')+'</div>';
    b.onclick=()=>{sfx('click');if(!unlocked){b.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:220});return}startRace(i)};
    list.appendChild(b);
  });
}
function startRace(i){
  initAudio();mini=null;newRace(i);showScreen(null);$('result').hidden=true;$('ctrl').classList.remove('hide');
  for(const id of['bL','bR','bD','bI','bB'])$(id).classList.toggle('hide',!isTouch);
  updateCamera(0,true);startEngine();startMusic();last=performance.now();
}
let pausedFrom='race';
function openPause(){if(state!=='race'&&state!=='count')return;pausedFrom=state;state='pause';stopEngine();stopMusic();showScreen('pause');applyAudio()}
function resume(){showScreen(null);state=pausedFrom;startEngine();startMusic();last=performance.now()}
$('btnGo').onclick=()=>{initAudio();sfx('click');openTracks()};$('tsBack').onclick=()=>openMenu();
$('pResume').onclick=resume;$('pRestart').onclick=()=>startRace(trackIdx);$('pQuit').onclick=()=>openMenu();
$('rAgain').onclick=()=>startRace(trackIdx);$('rMenu').onclick=()=>openMenu();$('rNext').onclick=()=>startRace(trackIdx+1);
function tog(k){initAudio();save[k]=save[k]?0:1;persist();applyAudio()}
$('tMusic').onclick=$('tMusic2').onclick=()=>tog('music');$('tSfx').onclick=$('tSfx2').onclick=()=>tog('sfx');
$('tQual').onclick=()=>{tog('hq');resize()};
$('tFree').onclick=()=>{initAudio();save.unlockAll=1;persist();sfx('win');$('tFree').textContent='✓ 赛道已全部解锁'};
document.addEventListener('visibilitychange',()=>{if(document.hidden)openPause()});

/* ============ 主循环 ============ */
let last=performance.now(),menuSpin=0;
buildTrack(TRACKS[0]);
let demo=makeKart(CHARS[save.char]);demo.group.position.copy(P[0]);let demoChar=save.char;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state==='count'||state==='race'){const h=dt/2;updateRace(h);updateRace(h);updateCamera(dt);setEngine(Math.abs(me.v)/VMAX,me.boostT>0,me.drift?(me.dT>1.5?2:1):0)}
  else if(state==='menu'||state==='over'){
    if(state==='menu'){if(demoChar!==save.char){scene.remove(demo.group);demo=makeKart(CHARS[save.char]);demoChar=save.char}demo.group.position.copy(P[0]);demo.group.rotation.y=Math.atan2(T[0].x,T[0].z);menuSpin+=dt*0.15;const c=P[0];demo.group.visible=true;camera.position.set(c.x+Math.sin(menuSpin)*14,c.y+6,c.z+Math.cos(menuSpin)*14);camera.lookAt(c.x,c.y+1,c.z);sun.position.set(c.x+40,80,c.z+30);sun.target.position.copy(c)}
  }
  if(state!=='menu')demo.group.visible=false;
  updateParts(dt);
  renderer.render(scene,camera);
  drawHUD(dt);
  requestAnimationFrame(frame);
}
openMenu();requestAnimationFrame(frame);
</script>
