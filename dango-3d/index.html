<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4fb6ff">
<title>团子大冒险</title>
<meta name="description" content="原创 3D 平台跳跃闯关：跑、跳、踩怪、顶问号砖、收集星星，6 个关卡和首领战。">
<style>
:root{--bg:#3a9ae8;--panel:#1f5fb0;--panel2:#2a74cc;--line:rgba(255,255,255,.3);--fg:#fff;--muted:#e0efff;--gold:#ffd23f;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{pointer-events:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#probe{position:fixed;visibility:hidden;pointer-events:none;inset:0;padding:var(--st) var(--sr) var(--sb) var(--sl)}
.screen{position:fixed;inset:0;display:flex;padding:calc(var(--st) + 14px) max(16px,var(--sr)) calc(var(--sb) + 14px) max(16px,var(--sl));background:linear-gradient(180deg,rgba(80,180,255,.85),rgba(40,110,210,.92));z-index:10;overflow:auto}
.screen.dim{background:rgba(20,60,130,.7);backdrop-filter:blur(3px)}
.screen[hidden]{display:none}
.box{width:100%;max-width:820px;margin:auto}
h1{margin:0;text-align:center;font-size:clamp(40px,9vw,66px);font-weight:900;color:#fff;-webkit-text-stroke:2px #1f4f9a;text-shadow:0 5px 0 #ff7aa8,0 10px 0 #1f4f9a}
h2{margin:0 0 10px;text-align:center;font-size:26px;font-weight:900;text-shadow:0 3px 0 #1f4f9a}
.sub{color:var(--muted);text-align:center;font-size:13px;margin:12px 0 14px;line-height:1.6}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:6px}
.top a{color:var(--muted);text-decoration:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:2px solid rgba(255,255,255,.45);background:var(--panel2);border-radius:16px;padding:12px 20px;font-size:17px;font-weight:900;min-height:50px;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn.primary{background:linear-gradient(180deg,#ffdd4a,#ff9d1c);color:#4a2500;border-color:#fff3b0}
.btn.free{background:linear-gradient(180deg,#ff8fbd,#e0457b);border-color:#ffd0e2}
.btn.small{padding:8px 14px;font-size:14px;min-height:40px}
@media (hover:hover){.btn:hover,.lvl:not(.lock):hover{filter:brightness(1.1)}}
.world{margin:12px 0}
.world h3{margin:0 0 8px;font-size:17px}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lvl{position:relative;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left;min-height:96px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4);overflow:hidden}
.lvl b{display:block;font-size:17px;margin:2px 0}
.lvl small{display:block;font-size:12px;opacity:.92}
.lvl .st{font-size:16px;margin-top:5px;letter-spacing:2px;color:var(--gold)}
.lvl.lock{filter:grayscale(.85) brightness(.7)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:12px 0 16px}
.res div{background:rgba(255,255,255,.15);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.res small{display:block;font-size:12px;color:var(--muted)}.res b{font-size:22px}
.big{text-align:center;font-size:46px;letter-spacing:6px;color:var(--gold);margin:4px 0;text-shadow:0 3px 0 #a66a00}
.hint{color:var(--muted);font-size:12px;text-align:center;line-height:1.7;margin-top:10px}
.hide{display:none!important}
#ctrl{position:fixed;inset:0;pointer-events:none;z-index:5}
#ctrl button{pointer-events:auto;position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(20,60,130,.35);font-weight:900;color:#fff;backdrop-filter:blur(2px)}
#ctrl button.on{background:rgba(255,255,255,.4)}
#bJ{right:calc(var(--sr) + 18px);bottom:calc(var(--sb) + 18px);width:104px;height:104px;font-size:22px;background:rgba(255,120,170,.45)!important}
#bA{right:calc(var(--sr) + 134px);bottom:calc(var(--sb) + 26px);width:70px;height:70px;font-size:15px}
#bP{right:calc(var(--sr) + 12px);top:calc(var(--st) + 10px);width:44px!important;height:44px!important;border-radius:12px!important;font-size:15px}
#bC{right:calc(var(--sr) + 64px);top:calc(var(--st) + 10px);width:44px!important;height:44px!important;border-radius:12px!important;font-size:14px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#3a9ae8;z-index:20;font-size:18px}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="loading">加载中…</div>
<div id="ctrl" class="hide">
  <button id="bJ" aria-label="跳跃">跳</button>
  <button id="bA" aria-label="冲刺">冲</button>
  <button id="bC" aria-label="视角">视角</button>
  <button id="bP" aria-label="暂停">II</button>
</div>

<div class="screen" id="menu">
  <div class="box">
    <div class="top"><a href="../">← 游戏大厅</a><span id="starTotal"></span></div>
    <h1>团子大冒险</h1>
    <p class="sub">在 3D 世界里跑跳闯关！踩扁毛毛球、顶开问号砖、吃星星糖变大，集齐每关 3 颗大星星，最后打败毛球大王。</p>
    <div id="worlds"></div>
    <div class="row" style="margin-top:8px"><button class="btn small" id="tMusic">音乐：开</button><button class="btn small" onclick="GameMusic.openPlaylist()">🎵 我的歌单</button><button class="btn small" id="tSfx">音效：开</button><button class="btn small" id="tQual">画质：高</button><button class="btn small free" id="tFree">🎁 免费解锁全部关卡</button></div>
    <p class="hint">手机：左半屏按住拖动 = 摇杆移动，右下「跳」跳跃（按久跳得高），「冲」加速跑。<br>电脑：WASD / 方向键移动，空格 跳，Shift 冲刺，C 切换视角，P 暂停。<br>落到敌人头上可以踩扁它们；带刺的不能踩！从下面顶问号砖会掉金币或道具。</p>
  </div>
</div>

<div class="screen dim" id="pause" hidden>
  <div class="box" style="max-width:420px">
    <h2 id="pTitle">暂停</h2>
    <div class="row" style="flex-direction:column;align-items:stretch">
      <button class="btn primary" id="pResume">继续</button>
      <button class="btn" id="pRestart">重新开始本关</button>
      <button class="btn" id="pQuit">返回关卡选择</button>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn small" id="tMusic2">音乐</button><button class="btn small" onclick="GameMusic.openPlaylist()">🎵 我的歌单</button><button class="btn small" id="tSfx2">音效</button></div>
  </div>
</div>

<div class="screen dim" id="clear" hidden>
  <div class="box" style="max-width:480px">
    <h2 id="cTitle">过关！</h2>
    <div class="big" id="cStars">★★★</div>
    <div class="res" id="cStats"></div>
    <div class="row">
      <button class="btn primary" id="cNext">下一关</button>
      <button class="btn" id="cAgain">再玩一次</button>
      <button class="btn" id="cMenu">关卡选择</button>
    </div>
  </div>
</div>

<script src="../lib/three.min.js"></script>
<script src="../lib/music.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
if(!window.THREE){$('loading').textContent='3D 引擎加载失败，请刷新重试';throw new Error('no three')}
$('loading').remove();

/* ============ 存档 ============ */
const SKEY='dango-3d-v1';
let save=(()=>{try{const s=JSON.parse(localStorage.getItem(SKEY));if(s)return Object.assign({lv:{},music:1,sfx:1,hq:isTouch?0:1,unlockAll:0,cam:0},s)}catch(e){}return{lv:{},music:1,sfx:1,hq:isTouch?0:1,unlockAll:0,cam:0}})();
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save))}catch(e){}}
const bits=n=>(n&1)+((n>>1)&1)+((n>>2)&1);

/* ============ 渲染 ============ */
const glc=$('gl'),hud=$('hud'),hx=hud.getContext('2d');
const renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true});
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,1,0.2,400);
let W=0,H=0,safeT=0,safeB=0;
function resize(){W=innerWidth;H=innerHeight;renderer.setPixelRatio(Math.min(save.hq?2:1.25,devicePixelRatio||1));renderer.setSize(W,H,false);camera.aspect=W/H;camera.fov=W<H?72:55;camera.updateProjectionMatrix();const r=Math.min(2,devicePixelRatio||1);hud.width=Math.round(W*r);hud.height=Math.round(H*r);const cs=getComputedStyle($('probe'));safeT=parseFloat(cs.paddingTop)||0;safeB=parseFloat(cs.paddingBottom)||0}
addEventListener('resize',resize);resize();
const hemi=new THREE.HemisphereLight(0xffffff,0x88aa66,0.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:120});sun.shadow.bias=-0.0006;scene.add(sun);scene.add(sun.target);

function ctex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
const TEX={
  q:ctex(64,64,(g,w,h)=>{g.fillStyle='#ffbf1f';g.fillRect(0,0,w,h);g.strokeStyle='#a85a00';g.lineWidth=5;g.strokeRect(3,3,w-6,h-6);g.fillStyle='#a85a00';for(const[x,y]of[[9,9],[55,9],[9,55],[55,55]])g.fillRect(x-2,y-2,4,4);g.font='bold 46px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#a85a00';g.fillText('?',w/2+2,h/2+4);g.fillStyle='#fff';g.fillText('?',w/2,h/2+2)}),
  used:ctex(64,64,(g,w,h)=>{g.fillStyle='#a8743c';g.fillRect(0,0,w,h);g.strokeStyle='#6b4520';g.lineWidth=5;g.strokeRect(3,3,w-6,h-6)}),
  brick:ctex(64,64,(g,w,h)=>{g.fillStyle='#d8743a';g.fillRect(0,0,w,h);g.fillStyle='#7a3a18';for(let y=0;y<4;y++){g.fillRect(0,y*16,w,3);for(let x=0;x<3;x++)g.fillRect(((x*24)+(y%2?12:0))%w,y*16,3,16)}}),
  stone:ctex(64,64,(g,w,h)=>{g.fillStyle='#8d93a3';g.fillRect(0,0,w,h);for(let i=0;i<40;i++){g.fillStyle='rgba(0,0,0,'+Math.random()*0.12+')';g.fillRect(Math.random()*w,Math.random()*h,6,6)}g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=2;g.strokeRect(1,1,w-2,h-2)}),
  sky:null,
};
for(const k of['stone'])TEX[k].wrapS=TEX[k].wrapT=THREE.RepeatWrapping;
function skyTex(a,b){return ctex(4,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,a);gr.addColorStop(1,b);g.fillStyle=gr;g.fillRect(0,0,w,h)})}
const dotTex=ctex(64,64,(g)=>{const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'#fff');gr.addColorStop(.4,'rgba(255,255,255,.7)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)});

const THEMES={
  grass:{sky:['#4fb6ff','#c9ecff'],fog:0xc9ecff,top:0x5ccf4a,side:0x9a6a3c,side2:0x8a5c32,sea:0x2f9fe8,seaE:0x0a3a6a,deco:1,music:0},
  sky:{sky:['#8f7bff','#ffc9e6'],fog:0xffd9ec,top:0xfffafd,side:0xb9a8ff,side2:0xa898f5,sea:0xffc0de,seaE:0x553344,deco:0,cloud:1,music:1},
  ice:{sky:['#7fc4ff','#eef8ff'],fog:0xe6f3ff,top:0xffffff,side:0x9fd4ff,side2:0x8cc8f5,sea:0x4a9ad8,seaE:0x0a2a4a,deco:0,snow:1,music:3},
  castle:{sky:['#2a0f1f','#7a2a1a'],fog:0x5a1f14,top:0x6a6f80,side:0x50545f,side2:0x464a55,sea:0xff6a1a,seaE:0xff3a00,deco:0,lava:1,music:2},
};

/* ============ 音频 ============ */
let AC=null,master,musicBus,sfxBus,noiseBuf,mus=null;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}master=AC.createGain();master.connect(AC.destination);musicBus=AC.createGain();musicBus.gain.value=save.music?0.2:0;musicBus.connect(master);sfxBus=AC.createGain();sfxBus.gain.value=save.sfx?0.55:0;sfxBus.connect(master);noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
function applyAudio(){GameMusic.setEnabled(!!save.music);if(musicBus)musicBus.gain.value=save.music?0.2:0;if(sfxBus)sfxBus.gain.value=save.sfx?0.55:0;for(const id of['tMusic','tMusic2'])$(id).textContent='音乐：'+(save.music?'开':'关');for(const id of['tSfx','tSfx2'])$(id).textContent='音效：'+(save.sfx?'开':'关');$('tQual').textContent='画质：'+(save.hq?'高':'流畅')}
function tone(f,d,type,v,slide,when){if(!AC)return;const t=when||AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+d+0.02)}
function noise(d,v,f,when){if(!AC)return;const t=when||AC.currentTime;const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f||1200;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(fl);fl.connect(g);g.connect(sfxBus);s.start(t);s.stop(t+d+0.02)}
function sfx(n){if(!AC)return;const now=AC.currentTime;switch(n){
  case 'jump':tone(400,0.18,'square',0.08,2.2);break;
  case 'coin':tone(988,0.07,'square',0.07);tone(1319,0.25,'square',0.07,1,now+0.07);break;
  case 'stomp':tone(220,0.12,'square',0.12,0.5);noise(0.1,0.2,900);break;
  case 'bump':tone(160,0.1,'square',0.12,0.8);break;
  case 'break':noise(0.3,0.4,2500);tone(120,0.2,'square',0.1,0.5);break;
  case 'power':[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.12,'square',0.07,1,now+i*0.06));break;
  case 'sprout':tone(300,0.4,'triangle',0.1,3);break;
  case 'hurt':tone(600,0.3,'square',0.1,0.3);break;
  case 'die':[523,494,440,392,349,330].forEach((f,i)=>tone(f,0.16,'square',0.08,1,now+i*0.12));break;
  case 'star':[1047,1319,1568,2093,1568,2093].forEach((f,i)=>tone(f,0.15,'square',0.07,1,now+i*0.07));break;
  case 'spring':tone(200,0.4,'sine',0.15,5);break;
  case 'check':[784,1047].forEach((f,i)=>tone(f,0.15,'triangle',0.1,1,now+i*0.1));break;
  case 'clear':[523,659,784,1047,0,784,1047,1319,1568].forEach((f,i)=>f&&tone(f,0.25,'square',0.08,1,now+i*0.12));break;
  case 'life':[659,784,1319,1047,1175,1568].forEach((f,i)=>tone(f,0.12,'square',0.08,1,now+i*0.08));break;
  case 'boss':tone(80,0.8,'sawtooth',0.15,1.5);break;
  case 'click':tone(900,0.04,'square',0.05);break;
}}
const SONGS=[
  {bpm:150,prog:[[60,64,67],[65,69,72],[67,71,74],[60,64,67]],mel:[12,null,16,19,null,16,12,null,14,null,17,21,19,null,16,null],wave:'square'},
  {bpm:120,prog:[[62,66,69],[67,71,74],[64,67,71],[69,73,76]],mel:[19,null,null,21,19,16,null,14,16,null,19,null,21,null,null,null],wave:'triangle'},
  {bpm:132,prog:[[57,60,64],[53,57,60],[52,56,59],[57,60,64]],mel:[12,15,12,null,11,null,12,null,15,17,15,null,12,null,null,null],wave:'square'},
];
const LV_MUSIC={'1-1':'stage1','1-2':'level1','1-3':'stage2','2-1':'sky','2-2':'castle','2-3':'boss','3-1':'ice1','3-2':'ice2','3-3':'ice3'};
GameMusic.setVolume(0.55);GameMusic.setEnabled(!!save.music);
function startMusic(){if(level)GameMusic.play('music/'+(LV_MUSIC[level.id]||'stage1')+'.m4a',{fade:0.4})}
function stopMusic(){GameMusic.pause()}
function startSynthMusic(si){
  stopMusic();if(!AC)return;const S=SONGS[si||0];const g=AC.createGain();g.connect(musicBus);const spb=60/S.bpm/2;mus={g,t0:AC.currentTime+0.05,step:0};
  mus.timer=setInterval(()=>{if(!mus)return;while(mus.t0+mus.step*spb<AC.currentTime+0.2){const t=mus.t0+mus.step*spb,i=mus.step,ch=S.prog[Math.floor(i/8)%4];const mt=m=>440*Math.pow(2,(m-69)/12);
    const nt=(f,d,type,v)=>{const o=AC.createOscillator(),gg=AC.createGain();o.type=type;o.frequency.value=f;gg.gain.setValueAtTime(0.0001,t);gg.gain.exponentialRampToValueAtTime(v,t+0.01);gg.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(gg);gg.connect(g);o.start(t);o.stop(t+d+0.05)};
    nt(mt(ch[0]-24+(i%2?7:0)),spb*0.9,'triangle',0.35);
    if(i%2===1){nt(mt(ch[1]),spb*0.5,'square',0.04);nt(mt(ch[2]),spb*0.5,'square',0.04)}
    const m=S.mel[i%16];if(m!==null&&i>=16)nt(mt(ch[0]+m),spb*0.95,S.wave,0.05);
    if(i%4===0){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=5000;const gg=AC.createGain();gg.gain.setValueAtTime(0.08,t);gg.gain.exponentialRampToValueAtTime(0.001,t+0.05);s.connect(f);f.connect(gg);gg.connect(g);s.start(t);s.stop(t+0.06)}
    mus.step++}},40);
}
function stopSynthMusic(){if(!mus)return;clearInterval(mus.timer);try{mus.g.gain.setTargetAtTime(0,AC.currentTime,0.05);const g=mus.g;setTimeout(()=>g.disconnect(),500)}catch(_){}mus=null}

/* ============ 关卡构建 ============ */
let level=null,world=null,TH=THEMES.grass;
const MAT={};
function mat(c,e){const k=c+'_'+(e||0);return MAT[k]||(MAT[k]=new THREE.MeshLambertMaterial({color:c,emissive:e||0}))}
const GEO={};const geo=(k,f)=>GEO[k]||(GEO[k]=f());
Object.assign(GEO,{eye:new THREE.SphereGeometry(0.13,8,6),pup:new THREE.SphereGeometry(0.06,6,5),foot:new THREE.SphereGeometry(0.18,8,6),brow:new THREE.BoxGeometry(0.22,0.05,0.05),spike:new THREE.ConeGeometry(0.12,0.35,6)});
function newLevelData(){return{solids:[],coins:[],stars:[],enemies:[],springs:[],bars:[],checks:[],goal:null,items:[],boss:null,start:{x:0,y:0,z:0},killY:-8,parts:[]}}

function makeEnemy(type,x,y,z,axis,range,speed){
  const g=new THREE.Group();g.position.set(x,y,z);world.add(g);
  const add=(gg,m,px,py,pz)=>{const o=new THREE.Mesh(gg,m);o.position.set(px,py,pz);o.castShadow=true;g.add(o);return o};
  const white=mat(0xffffff),black=mat(0x111111);
  let r=0.5;
  if(type==='walker'||type==='boss'){
    add(geo('wbody',()=>new THREE.SphereGeometry(0.5,14,12)),mat(type==='boss'?0x7a3a9a:0x9a5a2a),0,0.5,0);
    add(geo('eye',()=>new THREE.SphereGeometry(0.13,8,6)),white,-0.17,0.62,0.42);add(geo('eye',null),white,0.17,0.62,0.42);
    add(geo('pup',()=>new THREE.SphereGeometry(0.06,6,5)),black,-0.17,0.62,0.54);add(geo('pup',null),black,0.17,0.62,0.54);
    const b1=add(geo('brow',()=>new THREE.BoxGeometry(0.22,0.05,0.05)),black,-0.17,0.78,0.47);b1.rotation.z=-0.4;const b2=add(geo('brow',null),black,0.17,0.78,0.47);b2.rotation.z=0.4;
    g.userData.feet=[add(geo('foot',()=>new THREE.SphereGeometry(0.18,8,6)),mat(0x3a2a1a),-0.22,0.08,0.05),add(geo('foot',null),mat(0x3a2a1a),0.22,0.08,0.05)];
    if(type==='boss'){g.scale.setScalar(3.2);r=1.6;const cr=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.32,0.22,5,1,true),mat(0xffd23f,0x553300));cr.position.y=1.05;g.add(cr);for(let i=0;i<5;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.18,4),mat(0xffd23f,0x553300));const a=i/5*TAU;c.position.set(Math.cos(a)*0.28,1.2,Math.sin(a)*0.28);g.add(c)}}
  }else if(type==='spiky'){
    add(geo('sbody',()=>new THREE.SphereGeometry(0.45,14,12)),mat(0x7a4ad8),0,0.5,0);
    for(let i=0;i<10;i++){const a=i/10*TAU,b=(i%2?0.3:-0.1);const c=add(geo('spike',()=>new THREE.ConeGeometry(0.12,0.35,6)),mat(0xf0f0f0),Math.cos(a)*0.45,0.5+b+0.15,Math.sin(a)*0.45);c.lookAt(g.position.x+Math.cos(a)*3,g.position.y+0.5+b*3+0.6,g.position.z+Math.sin(a)*3);c.rotateX(Math.PI/2)}
    const t=add(geo('spike',null),mat(0xf0f0f0),0,1.02,0);
    add(geo('eye',null),white,-0.15,0.58,0.38);add(geo('eye',null),white,0.15,0.58,0.38);add(geo('pup',null),black,-0.15,0.58,0.5);add(geo('pup',null),black,0.15,0.58,0.5);
  }else if(type==='flyer'){
    add(geo('fbody',()=>new THREE.SphereGeometry(0.45,14,12)),mat(0xe0303a),0,0.5,0);
    add(geo('eye',null),white,-0.15,0.6,0.38);add(geo('eye',null),white,0.15,0.6,0.38);add(geo('pup',null),black,-0.15,0.6,0.5);add(geo('pup',null),black,0.15,0.6,0.5);
    const wg=geo('wing',()=>new THREE.PlaneGeometry(0.7,0.4));const wm=new THREE.MeshLambertMaterial({color:0xffffff,side:THREE.DoubleSide});
    const w1=new THREE.Mesh(wg,wm);w1.position.set(-0.6,0.7,0);g.add(w1);const w2=new THREE.Mesh(wg,wm);w2.position.set(0.6,0.7,0);g.add(w2);g.userData.wings=[w1,w2];
  }
  return{type,x,y,z,ox:x,oy:y,oz:z,axis:axis||'x',range:range||0,speed:speed||1.5,dir:1,g,r,dead:false,squash:0,hp:type==='boss'?3:1,inv:0,t:Math.random()*10,vy:0,state:'walk',jt:3};
}

  world=new THREE.Group();scene.add(world);
  level=newLevelData();level.id=L.id;level.killY=L.killY!==undefined?L.killY:-8;
  scene.background=skyTex(TH.sky[0],TH.sky[1]);scene.fog=new THREE.Fog(TH.fog,40,120);
  hemi.color.set(TH.lava?0xffb08a:0xffffff);hemi.groundColor.set(TH.lava?0x552211:0x88aa66);
  L.build();

const keys={},btn={j:0,a:0};let joy={id:null,ox:0,oy:0,x:0,y:0,on:false};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.repeat)return;
  if(state==='play'){if(e.code==='Space'||e.code==='KeyK'||e.code==='KeyJ'){e.preventDefault();me.jbuf=0.12}if(e.code==='KeyP'||e.code==='Escape')openPause();if(e.code==='KeyC')toggleCam()}
  else if(state==='pause'&&(e.code==='KeyP'||e.code==='Escape'))resume();
});
addEventListener('keyup',e=>{keys[e.code]=false});
function hold(id,k,fn){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();initAudio();btn[k]=1;b.classList.add('on');if(fn)fn()});const up=()=>{btn[k]=0;b.classList.remove('on')};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)}
hold('bJ','j',()=>{if(state==='play')me.jbuf=0.12});hold('bA','a');
$('bP').addEventListener('click',()=>openPause());$('bC').addEventListener('click',()=>toggleCam());
hud.style.pointerEvents='none';
glc.addEventListener('pointerdown',e=>{initAudio();if(state!=='play')return;if(joy.on)return;joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,x:e.clientX,y:e.clientY,on:true};try{glc.setPointerCapture(e.pointerId)}catch(_){}});
glc.addEventListener('pointermove',e=>{if(joy.on&&e.pointerId===joy.id){joy.x=e.clientX;joy.y=e.clientY;const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy),m=70;if(d>m){joy.ox=joy.x-dx/d*m;joy.oy=joy.y-dy/d*m}}});
const jEnd=e=>{if(e.pointerId===joy.id)joy.on=false};glc.addEventListener('pointerup',jEnd);glc.addEventListener('pointercancel',jEnd);
function moveIn(){
  let x=0,z=0;if(keys.KeyA||keys.ArrowLeft)x-=1;if(keys.KeyD||keys.ArrowRight)x+=1;if(keys.KeyW||keys.ArrowUp)z-=1;if(keys.KeyS||keys.ArrowDown)z+=1;
  if(x||z){const d=Math.hypot(x,z);return[x/d,z/d]}
  if(joy.on){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>8){const m=Math.min(1,d/55);return[dx/d*m,dy/d*m]}}
  return[0,0];
}
let jumpHeld=()=>!!(keys.Space||keys.KeyK||keys.KeyJ||btn.j);
let runHeld=()=>!!(keys.ShiftLeft||keys.ShiftRight||btn.a);

/* ============ 物理 ============ */
const GRAV=34;
function overlapS(p,s,hw,h){return p.x+hw>s.x0&&p.x-hw<s.x1&&p.y+h>s.y0&&p.y<s.y1&&p.z+hw>s.z0&&p.z-hw<s.z1}
function moveAxis(p,axis,amt){
  if(!amt)return;
  const steps=Math.ceil(Math.abs(amt)/0.3);const da=amt/steps;
  for(let k=0;k<steps;k++){
    p[axis]+=da;
    for(const s of level.solids){
      if(!s.active||!overlapS(p,s,p.hw,p.h))continue;
      if(axis==='y'){
        if(da<0){p.y=s.y1;p.vy=0;p.landed=s}
        else{p.y=s.y0-p.h;if(p.vy>0)p.vy=0;bumpBlock(s)}
      }else if(axis==='x'){p.x=da>0?s.x0-p.hw-1e-4:s.x1+p.hw+1e-4;p.vx=0}
      else{p.z=da>0?s.z0-p.hw-1e-4:s.z1+p.hw+1e-4;p.vz=0}
      if(axis!=='y')break;
    }
  }
}
function bumpBlock(s){
  if(s.bumped>0)return;
  if(s.kind==='q'){s.kind='used';s.body.material=new THREE.MeshLambertMaterial({map:TEX.used});s.bumped=0.2;spawnReward(s);sfx('bump')}
  else if(s.kind==='brick'){if(me.big){s.active=false;s.mesh.visible=false;for(let i=0;i<16;i++)burst(s.x0+0.5,s.y0+0.5,s.z0+0.5,'#d8743a',1);sfx('break')}else{s.bumped=0.2;sfx('bump')}}
  else sfx('bump');
  // 顶起砖块上的敌人

  camera.position.copy(camP);if(camShake>0){camShake-=dt;camera.position.x+=(Math.random()-0.5)*0.5;camera.position.y+=(Math.random()-0.5)*0.5}
  camera.lookAt(camL);
  sun.position.set(p.x+12,p.y+30,p.z+14);sun.target.position.set(p.x,p.y,p.z);
}

/* ============ HUD ============ */
const v3=new THREE.Vector3();
function drawHUD(dt){
  const s=hud.width/W;hx.setTransform(s,0,0,s,0,0);hx.clearRect(0,0,W,H);if(state==='menu'||!level)return;
  const ui=clamp(Math.min(W,H)/400,0.85,1.4),top=safeT+12;
  hx.textBaseline='middle';hx.textAlign='left';hx.lineWidth=5;hx.strokeStyle='#1f4f9a';
  const txt=(t,x,y,size,c)=>{hx.font='900 '+Math.round(size*ui)+'px sans-serif';hx.strokeText(t,x,y);hx.fillStyle=c||'#fff';hx.fillText(t,x,y)};
  txt('🍡 × '+lives,16,top+12*ui,20);txt('🪙 '+coins,16,top+40*ui,18,'#ffd23f');
  for(let i=0;i<3;i++){const st=level.stars[i];const got=st&&(st.got||st.old);hx.font=Math.round(24*ui)+'px sans-serif';hx.globalAlpha=st&&st.got?1:got?0.55:0.3;hx.fillText('⭐',16+i*30*ui,top+70*ui);hx.globalAlpha=1}
  hx.textAlign='center';txt(LEVELS[lvIdx].id+' '+LEVELS[lvIdx].name,W/2,top+12*ui,16);txt(lvT.toFixed(1)+'s',W/2,top+36*ui,14,'#e0efff');
  if(level.boss&&level.boss.active&&!level.boss.dead){const bw=Math.min(300,W*0.5);hx.fillStyle='rgba(0,0,0,.4)';hx.fillRect(W/2-bw/2,top+52*ui,bw,10);hx.fillStyle='#ff5a8a';hx.fillRect(W/2-bw/2,top+52*ui,bw*level.boss.hp/3,10);txt('毛球大王',W/2,top+72*ui,13)}
  let py=H*0.3;
  for(const p of pops){p.t-=dt;const a=clamp(Math.min(p.t*3,(p.max-p.t)*10),0,1);hx.globalAlpha=a;
    if(p.w){v3.copy(p.w);v3.y+=(p.max-p.t)*1.2;v3.project(camera);txt(p.text,(v3.x+1)/2*W,(1-v3.y)/2*H,18,p.color)}else{txt(p.text,W/2,py,26,p.color);py+=36*ui}}
  hx.globalAlpha=1;pops=pops.filter(p=>p.t>0);
  if(joy.on){hx.strokeStyle='rgba(255,255,255,.5)';hx.lineWidth=3;hx.beginPath();hx.arc(joy.ox,joy.oy,70,0,TAU);hx.stroke();hx.fillStyle='rgba(255,255,255,.45)';hx.beginPath();hx.arc(joy.x,joy.y,28,0,TAU);hx.fill()}
  else if(isTouch&&lvT<6){hx.fillStyle='rgba(255,255,255,.25)';hx.beginPath();hx.arc(110,H-safeB-110,60,0,TAU);hx.fill();txt('按住拖动移动',110,H-safeB-110,13)}
  if(me.dead&&lives<=0){txt('游戏结束',W/2,H*0.45,40,'#ff8fb0')}
}

/* ============ 界面 ============ */
function showScreen(id){for(const s of['menu','pause','clear'])$(s).hidden=s!==id}
function openMenu(){
  state='menu';GameMusic.play('music/select.m4a',{fade:0.5});$('ctrl').classList.add('hide');showScreen('menu');applyAudio();
  const wl=$('worlds');wl.innerHTML='';let total=0;
  WORLDS.forEach(w=>{const d=document.createElement('div');d.className='world';d.innerHTML='<h3>'+w.name+'</h3>';const g=document.createElement('div');g.className='lvls';
    for(const i of w.lv){const L=LEVELS[i],rec=save.lv[L.id]||{stars:0};total+=bits(rec.stars);const unlocked=save.unlockAll||i===0||(save.lv[LEVELS[i-1].id]||{}).done;
      const b=document.createElement('button');b.className='lvl'+(unlocked?'':' lock');b.style.background=w.c;
      b.innerHTML='<small>'+L.id+(i===5?' · 首领战':'')+'</small><b>'+(unlocked?'':'🔒 ')+L.name+'</b><div class="st">'+'★'.repeat(bits(rec.stars))+'☆'.repeat(3-bits(rec.stars))+'</div>'+(rec.best?'<small>最佳 '+rec.best.toFixed(1)+'s</small>':'');
      b.onclick=()=>{initAudio();sfx('click');if(!unlocked){b.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:220});return}lives=5;startLevel(i)};g.appendChild(b)}
    d.appendChild(g);wl.appendChild(d)});
  $('starTotal').textContent='⭐ '+total+' / '+LEVELS.length*3;
  if(!level){loadLevel(0)}
}
function startLevel(i){
  initAudio();if(me)me.big=false;loadLevel(i);state='play';showScreen(null);$('ctrl').classList.remove('hide');
  for(const id of['bJ','bA'])$(id).classList.toggle('hide',!isTouch);
  startMusic(THEMES[LEVELS[i].theme].music);last=performance.now();
}
function openPause(){if(state!=='play')return;state='pause';stopMusic();$('pTitle').textContent=LEVELS[lvIdx].id+' '+LEVELS[lvIdx].name;showScreen('pause');applyAudio()}
function resume(){showScreen(null);state='play';startMusic(TH.music);last=performance.now()}
$('pResume').onclick=resume;$('pRestart').onclick=()=>startLevel(lvIdx);$('pQuit').onclick=()=>openMenu();
$('cNext').onclick=()=>startLevel(lvIdx+1);$('cAgain').onclick=()=>startLevel(lvIdx);$('cMenu').onclick=()=>openMenu();
function tog(k){initAudio();save[k]=save[k]?0:1;persist();applyAudio()}
$('tMusic').onclick=$('tMusic2').onclick=()=>tog('music');$('tSfx').onclick=$('tSfx2').onclick=()=>tog('sfx');$('tQual').onclick=()=>{tog('hq');resize()};
$('tFree').onclick=()=>{initAudio();save.unlockAll=1;persist();sfx('power');openMenu()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)openPause()});

/* ============ 主循环 ============ */
let last=performance.now(),acc=0,menuT=0;
function step(dt){
  if(state!=='play')return;
  if(!me.dead&&!me.win)lvT+=dt;
  updateWorld(dt);updatePlayer(dt);
  if(me.dead){deadT-=dt;if(deadT<=0){if(lives<=0){lives=5;openMenu();return}const keep=Object.assign({},respawn);const cpOn=level.checks.filter(c=>c.on).map(c=>c);me.big=false;loadLevelKeep(keep,cpOn)}}
  if(me.win&&me.slide){me.vy=0}
}
function loadLevelKeep(rp,cps){
  // 重开本关但保留存档点、金币和已拿到的星星
  const keepCoins=coins,keepStars=level.stars.filter(s=>s.got).map(s=>s.id),keepT=lvT;loadLevel(lvIdx);coins=keepCoins;lvT=keepT;
  respawn=rp;for(const c of level.checks)if(cps.some(o=>o.x===c.x&&o.z===c.z)){c.on=true;c.flag.material.color.set(0x5fd06a)}
  for(const s of level.stars)if(keepStars.includes(s.id)){s.got=true;s.mesh.visible=false}
  spawnPlayer();startMusic(TH.music);
}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state==='play'){acc+=dt;let n=0;while(acc>=1/120&&n<10){step(1/120);acc-=1/120;n++}syncHero(dt);updateCamera(dt)}
  else if(state==='menu'&&level){menuT+=dt;camera.position.set(Math.sin(menuT*0.2)*12,8,-10+Math.cos(menuT*0.2)*12);camera.lookAt(0,1,-12);sun.position.set(12,30,4);sun.target.position.set(0,0,-10)}
  if(level)for(const e of level.enemies)if(!e.dead&&state==='menu'){e.t+=dt}
  updateParts(dt);renderer.render(scene,camera);drawHUD(dt);requestAnimationFrame(frame);
}
openMenu();requestAnimationFrame(frame);
</script>
