<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4fb6ff">
<title>团子大冒险</title>
<meta name="description" content="原创横版闯关：跑、跳、踩怪、顶礼物盒、吃草莓变大、吃辣椒放火球，三个世界 12 关和首领战。">
<style>
:root{--bg:#3a9ae8;--panel2:#2a74cc;--line:rgba(255,255,255,.3);--fg:#fff;--muted:#e0efff;--gold:#ffd23f;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{pointer-events:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#probe{position:fixed;visibility:hidden;pointer-events:none;inset:0;padding:var(--st) var(--sr) var(--sb) var(--sl)}
.screen{position:fixed;inset:0;display:flex;padding:calc(var(--st) + 14px) max(16px,var(--sr)) calc(var(--sb) + 14px) max(16px,var(--sl));background:linear-gradient(180deg,rgba(80,180,255,.88),rgba(40,110,210,.94));z-index:10;overflow:auto}
.screen.dim{background:rgba(20,60,130,.72);backdrop-filter:blur(3px)}
.screen[hidden]{display:none}
.box{width:100%;max-width:860px;margin:auto}
h1{margin:0;text-align:center;font-size:clamp(40px,9vw,66px);font-weight:900;color:#fff;-webkit-text-stroke:2px #1f4f9a;text-shadow:0 5px 0 #ff7aa8,0 10px 0 #1f4f9a}
h2{margin:0 0 10px;text-align:center;font-size:26px;font-weight:900;text-shadow:0 3px 0 #1f4f9a}
.sub{color:var(--muted);text-align:center;font-size:13px;margin:12px 0 14px;line-height:1.6}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:6px}
.top a{color:var(--muted);text-decoration:none}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:2px solid rgba(255,255,255,.45);background:var(--panel2);border-radius:16px;padding:12px 20px;font-size:17px;font-weight:900;min-height:50px;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn.primary{background:linear-gradient(180deg,#ffdd4a,#ff9d1c);color:#4a2500;border-color:#fff3b0}
.btn.free{background:linear-gradient(180deg,#ff8fbd,#e0457b);border-color:#ffd0e2}
.btn.small{padding:8px 14px;font-size:14px;min-height:40px}
@media (hover:hover){.btn:hover,.lvl:not(.lock):hover{filter:brightness(1.1)}}
.world{margin:12px 0}
.world h3{margin:0 0 8px;font-size:17px}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lvl{position:relative;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left;min-height:92px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.4);overflow:hidden}
.lvl b{display:block;font-size:17px;margin:2px 0}
.lvl small{display:block;font-size:12px;opacity:.92}
.lvl .st{font-size:16px;margin-top:5px;letter-spacing:2px;color:var(--gold)}
.lvl.lock{filter:grayscale(.85) brightness(.7)}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:12px 0 16px}
.res div{background:rgba(255,255,255,.15);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.res small{display:block;font-size:12px;color:var(--muted)}.res b{font-size:22px}
.big{text-align:center;font-size:46px;letter-spacing:6px;color:var(--gold);margin:4px 0;text-shadow:0 3px 0 #a66a00}
.hint{color:var(--muted);font-size:12px;text-align:center;line-height:1.7;margin-top:10px}
.hide{display:none!important}
#ctrl{position:fixed;inset:0;pointer-events:none;z-index:5}
#ctrl>*{pointer-events:auto;position:absolute}
#pad{left:calc(var(--sl) + 12px);bottom:calc(var(--sb) + 12px);width:210px;height:100px;display:flex;gap:12px;touch-action:none}
.pk{flex:1;border-radius:22px;border:3px solid rgba(255,255,255,.5);background:rgba(20,60,130,.22);display:grid;place-items:center;font-size:40px;color:#fff;backdrop-filter:blur(2px);text-shadow:0 2px 3px rgba(0,0,0,.3)}
.pk.on{background:rgba(255,255,255,.45)}
#bJ{right:calc(var(--sr) + 16px);bottom:calc(var(--sb) + 16px);width:112px;height:112px;border-radius:50%;border:3px solid rgba(255,255,255,.6);background:rgba(255,110,160,.55);font-size:26px;font-weight:900;color:#fff;touch-action:none}
#bF{right:calc(var(--sr) + 140px);bottom:calc(var(--sb) + 22px);width:78px;height:78px;border-radius:50%;border:3px solid rgba(255,255,255,.6);background:rgba(255,120,40,.55);font-size:28px;touch-action:none}
#bJ.on,#bF.on{filter:brightness(1.4)}
#bP{right:calc(var(--sr) + 12px);top:calc(var(--st) + 10px);width:46px;height:46px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:rgba(20,60,130,.4);font-weight:900;font-size:16px}
@media (orientation:portrait){#pad{width:180px;height:100px}#bJ{width:96px;height:96px}#bF{right:calc(var(--sr) + 122px);width:68px;height:68px}}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#3a9ae8;z-index:20;font-size:18px}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="loading">加载中…</div>
<div id="ctrl" class="hide">
  <div id="pad"><div class="pk" id="pkL">◀</div><div class="pk" id="pkR">▶</div></div>
  <button id="bF" class="hide" aria-label="火球">🔥</button>
  <button id="bJ" aria-label="跳跃">跳</button>
  <button id="bP" aria-label="暂停">II</button>
</div>

<div class="screen" id="menu">
  <div class="box">
    <div class="top"><a href="../">← 游戏大厅</a><span id="starTotal"></span></div>
    <h1>团子大冒险</h1>
    <p class="sub">横版闯关！踩扁毛毛球、顶开礼物盒、吃草莓变成三色团子、吃辣椒放火球，集齐每关 3 颗大星星，最后打败毛球大王。</p>
    <div id="worlds"></div>
    <div class="row" style="margin-top:8px"><button class="btn small" id="tMusic">音乐：开</button><button class="btn small" onclick="GameMusic.openPlaylist()">🎵 我的歌单</button><button class="btn small" id="tSfx">音效：开</button><button class="btn small" id="tQual">画质：高</button><button class="btn small free" id="tFree">🎁 免费解锁全部关卡</button></div>
    <p class="hint">手机（横屏更好玩）：左下 ◀ ▶ 移动（手指可以在两个键之间滑），按住一会儿会自动加速跑；右下「跳」，按久跳得高；吃了辣椒后点 🔥 放火球。<br>电脑：← → 或 A D 移动，空格 / ↑ 跳，Shift 加速跑，J 放火球，P 暂停。</p>
  </div>
</div>

<div class="screen dim" id="pause" hidden>
  <div class="box" style="max-width:420px">
    <h2 id="pTitle">暂停</h2>
    <div class="row" style="flex-direction:column;align-items:stretch">
      <button class="btn primary" id="pResume">继续</button>
      <button class="btn" id="pRestart">重新开始本关</button>
      <button class="btn" id="pQuit">返回关卡选择</button>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn small" id="tMusic2">音乐</button><button class="btn small" onclick="GameMusic.openPlaylist()">🎵 我的歌单</button><button class="btn small" id="tSfx2">音效</button></div>
  </div>
</div>

<div class="screen dim" id="clear" hidden>
  <div class="box" style="max-width:480px">
    <h2 id="cTitle">过关！</h2>
    <div class="big" id="cStars">★★★</div>
    <div class="res" id="cStats"></div>
    <p class="sub" id="cNote"></p>
    <div class="row">
      <button class="btn primary" id="cNext">下一关</button>
      <button class="btn" id="cAgain">再玩一次</button>
      <button class="btn" id="cMenu">关卡选择</button>
    </div>
  </div>
</div>

<script src="../lib/three.min.js"></script>
<script src="../lib/music.js"></script>
<script src="levels.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
if(!window.THREE||!window.DANGO_LEVELS){$('loading').textContent='加载失败，请刷新重试';throw new Error('missing')}
$('loading').remove();
const {LEVELS,WORLDS,HH}=window.DANGO_LEVELS;

/* ============ 存档 ============ */
const SKEY='dango-side-v1';
let save=(()=>{const d={lv:{},music:1,sfx:1,hq:isTouch?0:1,unlockAll:0};try{const s=JSON.parse(localStorage.getItem(SKEY));if(s)return Object.assign(d,s)}catch(e){}return d})();
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save))}catch(e){}}
const bits=n=>(n&1)+((n>>1)&1)+((n>>2)&1);

/* ============ 渲染基础 ============ */
const glc=$('gl'),hud=$('hud'),hx=hud.getContext('2d');
const renderer=new THREE.WebGLRenderer({canvas:glc,antialias:true});
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,0.5,400);
let W=0,H=0,safeT=0,safeB=0,safeL=0;
function resize(){W=innerWidth;H=innerHeight;renderer.setPixelRatio(Math.min(save.hq?2:1.3,devicePixelRatio||1));renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();const r=Math.min(2,devicePixelRatio||1);hud.width=Math.round(W*r);hud.height=Math.round(H*r);const cs=getComputedStyle($('probe'));safeT=parseFloat(cs.paddingTop)||0;safeB=parseFloat(cs.paddingBottom)||0;safeL=parseFloat(cs.paddingLeft)||0}
addEventListener('resize',resize);resize();
const hemi=new THREE.HemisphereLight(0xffffff,0x8899aa,0.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(-6,14,10);scene.add(sun);
const amb=new THREE.AmbientLight(0xffffff,0.12);scene.add(amb);

function ctex(w,h,fn,rep){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping}return t}
function speckle(g,w,h,n,cols,s){for(let i=0;i<n;i++){g.fillStyle=cols[i%cols.length];const x=Math.random()*w,y=Math.random()*h,r=(s||3)*(0.5+Math.random());g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}}
const TEX={
  gift:ctex(64,64,(g,w,h)=>{g.fillStyle='#ffd23f';g.fillRect(0,0,w,h);g.fillStyle='#ffe98a';g.fillRect(4,4,w-8,10);g.fillStyle='#ff5a8a';g.fillRect(26,0,12,h);g.fillRect(0,26,w,12);g.strokeStyle='#c98a00';g.lineWidth=4;g.strokeRect(2,2,w-4,h-4);g.fillStyle='#fff';g.beginPath();g.arc(32,32,11,0,TAU);g.fill();g.fillStyle='#ff5a8a';g.font='bold 18px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('?',32,33)}),
  used:ctex(64,64,(g,w,h)=>{g.fillStyle='#b5824a';g.fillRect(0,0,w,h);g.strokeStyle='#7a5228';g.lineWidth=5;g.strokeRect(3,3,w-6,h-6);g.fillStyle='#7a5228';for(const[x,y]of[[12,12],[52,12],[12,52],[52,52]]){g.beginPath();g.arc(x,y,3,0,TAU);g.fill()}}),
  stone:ctex(64,64,(g,w,h)=>{g.fillStyle='#9aa0b0';g.fillRect(0,0,w,h);g.fillStyle='#b8bdca';g.fillRect(0,0,w,6);g.fillRect(0,0,6,h);g.fillStyle='#6f7586';g.fillRect(0,h-6,w,6);g.fillRect(w-6,0,6,h);speckle(g,w,h,14,['rgba(0,0,0,.12)','rgba(255,255,255,.12)'],3)}),
  bark:ctex(64,64,(g,w,h)=>{g.fillStyle='#9a6a3a';g.fillRect(0,0,w,h);g.strokeStyle='#6f4a26';g.lineWidth=3;for(let x=6;x<w;x+=11){g.beginPath();g.moveTo(x,0);g.bezierCurveTo(x+4,20,x-4,40,x+2,h);g.stroke()}}),
  rings:ctex(64,64,(g,w,h)=>{g.fillStyle='#e8c48a';g.fillRect(0,0,w,h);g.strokeStyle='#b5894f';g.lineWidth=3;for(let r=6;r<30;r+=7){g.beginPath();g.arc(32,32,r,0,TAU);g.stroke()}g.strokeStyle='#7aba4a';g.lineWidth=6;g.strokeRect(0,0,w,h)}),
  plank:ctex(64,32,(g,w,h)=>{g.fillStyle='#d99a55';g.fillRect(0,0,w,h);g.fillStyle='#b5793d';g.fillRect(0,h-6,w,6);g.fillRect(31,0,3,h);g.fillStyle='#8a5a2a';for(const x of[6,26,38,58]){g.beginPath();g.arc(x,12,2.2,0,TAU);g.fill()}}),
  cannon:ctex(64,64,(g,w,h)=>{g.fillStyle='#3a3f4f';g.fillRect(0,0,w,h);g.fillStyle='#545a6e';g.fillRect(4,4,w-8,14);g.fillStyle='#ffd23f';g.beginPath();g.arc(32,38,9,0,TAU);g.fill();g.fillStyle='#3a3f4f';g.fillRect(29,30,6,16)}),
  ice:ctex(64,64,(g,w,h)=>{g.fillStyle='#bfe9ff';g.fillRect(0,0,w,h);g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=3;g.beginPath();g.moveTo(8,50);g.lineTo(26,20);g.moveTo(34,56);g.lineTo(54,22);g.stroke();g.strokeStyle='#8fcff5';g.lineWidth=4;g.strokeRect(2,2,w-4,h-4)}),
};
function brickTex(base,mortar){return ctex(64,64,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);g.fillStyle=mortar;for(let y=0;y<4;y++){g.fillRect(0,y*16,w,3);for(let x=0;x<3;x++)g.fillRect(((x*24)+(y%2?12:0))%w,y*16,3,16)}g.fillStyle='rgba(255,255,255,.15)';g.fillRect(0,3,w,3)})}

/* 主题：天空、地面花纹、装饰 */
const THEMES={
  grass:{sky:['#4fb2ff','#d6f1ff'],top:'#62d34e',topD:'#43ad3d',side:'#c08048',sideD:'#97603a',pat:'dirt',brick:['#d8743a','#7a3a18'],hills:[0x86de6e,0x5cc45a,0x4aa84e],deco:'tree',bgFar:0x9fd6ff},
  cave:{sky:['#140f26','#2c2148'],top:'#8a7bc0',topD:'#6a5b9a',side:'#4e4372',sideD:'#3a3058',pat:'rock',brick:['#5a6bb0','#2a3266'],hills:[0x2a2246,0x221c3a,0x1c1730],deco:'crystal',dark:1,bgFar:0x1a1430},
  castle:{sky:['#1f0a14','#5a1f16'],top:'#8a8f9f',topD:'#6a6f80',side:'#555a68',sideD:'#444855',pat:'castle',brick:['#7a7f8f','#3a3e4a'],hills:[0x3a1a18,0x2e1412,0x241010],deco:'pillar',dark:1,lava:1,bgFar:0x3a1410},
  snow:{sky:['#7fc2ff','#eef8ff'],top:'#ffffff',topD:'#dbeeff',side:'#8fb4d8',sideD:'#7398c0',pat:'dirt',brick:['#6a9ad8','#2a4a80'],hills:[0xe4f0ff,0xcadff5,0xb4d0ec],deco:'pine',snowfall:1,bgFar:0xcfe6ff},
  sky:{sky:['#8a96ff','#ffd2ea'],top:'#ffffff',topD:'#f0ecff',side:'#e4dcff',sideD:'#cfc4f5',pat:'cloud',brick:['#ff9dc4','#c8507e'],hills:[0xffffff,0xfff0fa,0xf0e8ff],deco:'cloud',bgFar:0xffe0f0},
  icecastle:{sky:['#0e1a38','#2e4c80'],top:'#d6ecff',topD:'#b0d4f5',side:'#5a7aa8',sideD:'#4a6894',pat:'castle',brick:['#8ab4e0','#3a5a8a'],hills:[0x1a2c55,0x16264a,0x12203e],deco:'pillar',dark:1,bgFar:0x1a2c55},
  volcano:{sky:['#ff8a4a','#ffd49a'],top:'#6a5448',topD:'#54423a',side:'#3e2e28',sideD:'#2e221e',pat:'rock',brick:['#a8503a','#4a1e14'],hills:[0x7a4a3a,0x5a382c,0x48302a],deco:'volcano',bgFar:0xffb07a},
  lavacave:{sky:['#1e0806','#4a140c'],top:'#7a5a4a',topD:'#5a4234',side:'#3a2620',sideD:'#2a1c18',pat:'rock',brick:['#8a4a3a','#3a1a14'],hills:[0x2a100c,0x220c0a,0x1a0a08],deco:'crystal',dark:1,lava:1,bgFar:0x3a120c},
};
const groundTexCache={};
function groundTex(th){
  const k=th.top+th.side+th.pat;if(groundTexCache[k])return groundTexCache[k];
  const fillPat=(g,w,h,c1,c2)=>{g.fillStyle=c1;g.fillRect(0,0,w,h);
    if(th.pat==='dirt')speckle(g,w,h,18,[c2,'rgba(255,255,255,.18)'],3);
    else if(th.pat==='rock'){g.strokeStyle=c2;g.lineWidth=3;for(let i=0;i<5;i++){g.beginPath();g.moveTo(Math.random()*w,Math.random()*h);g.lineTo(Math.random()*w,Math.random()*h);g.stroke()}speckle(g,w,h,10,[c2],2)}
    else if(th.pat==='castle'){g.fillStyle=c2;for(let y=0;y<2;y++){g.fillRect(0,y*32,w,3);g.fillRect(y?16:48,y*32,3,32)}}
    else if(th.pat==='cloud'){speckle(g,w,h,10,['rgba(255,255,255,.7)'],8)}};
  const top=ctex(64,64,(g,w,h)=>{g.fillStyle=th.top;g.fillRect(0,0,w,h);speckle(g,w,h,16,[th.topD,'rgba(255,255,255,.35)'],3)});
  const side=ctex(64,64,(g,w,h)=>{fillPat(g,w,h,th.side,th.sideD);g.fillStyle=th.top;g.fillRect(0,0,w,18);g.fillStyle=th.topD;for(let x=0;x<w;x+=8){g.beginPath();g.moveTo(x,18);g.lineTo(x+4,26);g.lineTo(x+8,18);g.fill()}});
  const fill=ctex(64,64,(g,w,h)=>fillPat(g,w,h,th.side,th.sideD));
  return groundTexCache[k]={top,side,fill};
}
const MATC={};
function mat(c,e,o){const k=c+'_'+(e||0)+'_'+(o||1);return MATC[k]||(MATC[k]=new THREE.MeshLambertMaterial({color:c,emissive:e||0,transparent:o<1,opacity:o||1}))}
const GEO={};const geo=(k,f)=>GEO[k]||(GEO[k]=f());

/* ============ 音频 ============ */
let AC=null,sfxBus,noiseBuf;
function initAudio(){GameMusic.unlock();if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}sfxBus=AC.createGain();sfxBus.gain.value=save.sfx?0.5:0;sfxBus.connect(AC.destination);noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}

function tone(f,d,type,v,slide,when){if(!AC)return;const t=when||AC.currentTime;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+d+0.02)}

function blockKey(x,y,c){

const M4=new THREE.Matrix4(),Q=new THREE.Quaternion(),V=new THREE.Vector3(),S1=new THREE.Vector3(1,1,1),S0=new THREE.Vector3(0.0001,0.0001,0.0001);
function setInst(key,idx,x,y,dy,hide){const I=INST[key];if(!I)return;V.set(x+0.5,y+0.5+(dy||0),0);M4.compose(V,Q,hide?S0:S1);I.mesh.setMatrixAt(idx,M4);I.mesh.instanceMatrix.needsUpdate=true}
function buildBlocks(){
  const BM=makeBlockMats();const lists={};
  for(let x=0;x<LW;x++)for(let y=0;y<HH;y++){const k=blockKey(x,y,G[x][y]);if(!k)continue;(lists[k]=lists[k]||[]).push([x,y])}
  // 关卡两端外面补一截地面（只是画面，不能走过去），镜头可以把团子放在屏幕中间
  for(const [src,from,to] of [[0,-16,0],[LW-1,LW,LW+16]])for(let y=0;y<HH;y++){const c=G[src][y];if(c!=='#'&&c!=='X')continue;const k=c==='X'?'stone':(G[src][y+1]==='#'?'fill':'top');for(let x=from;x<to;x++)(lists[k]=lists[k]||[]).push([x,y])}
  // 地面往下加厚（竖屏时下面不会露出空白）；坑的位置保持空的
  for(let x=-16;x<LW+16;x++){const c=G[clamp(x,0,LW-1)][0];if(c!=='#')continue;for(let y=-1;y>=-9;y--)(lists.fill=lists.fill||[]).push([x,y])}
  let nGift=(lists.gift||[]).length;for(let x=0;x<LW;x++)for(let y=0;y<HH;y++)if(G[x][y]==='I')nGift++;
  INST={};
  const keys=new Set(Object.keys(lists));keys.add('used');
  for(const k of keys){const list=lists[k]||[];const cap=list.length+(k==='used'?nGift:0);if(!cap)continue;
    const b=BM[k];const mesh=new THREE.InstancedMesh(b.g,b.m,cap);mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);world.add(mesh);
    INST[k]={mesh,n:list.length,cap};
    list.forEach(([x,y],i)=>{cellInst[x+','+y]={key:k,idx:i};setInst(k,i,x,y)});
    for(let i=list.length;i<cap;i++){M4.compose(V.set(0,-50,0),Q,S0);mesh.setMatrixAt(i,M4)}
  }
}
function setTile(x,y,c){
  const old=cellInst[x+','+y];if(old){setInst(old.key,old.idx,x,y,0,true);delete cellInst[x+','+y]}
  G[x][y]=c;const k=blockKey(x,y,c);
  if(k&&INST[k]){const I=INST[k];if(I.n<I.cap){const idx=I.n++;cellInst[x+','+y]={key:k,idx};setInst(k,idx,x,y)}}
  // 地面顶面变化（砖块被顶碎后下面的地面不变，这里只处理方块本身）
}

const GUP=52,GDOWN=95,MAXFALL=22;
function moveBody(o,dt){
  o.hitWall=0;
  // 水平
  let nx=o.x+o.vx*dt;
  if(o.vx){const edge=o.vx>0?nx+o.w:nx-o.w,cx=Math.floor(edge);
    for(let cy=Math.floor(o.y+0.02);cy<=Math.floor(o.y+o.h-0.02);cy++)if(solidAt(cx,cy)){nx=o.vx>0?cx-o.w-0.0005:cx+1+o.w+0.0005;o.hitWall=o.vx>0?1:-1;o.vx=0;break}}
  o.x=nx;
  // 竖直
  const prevY=o.y;let ny=o.y+o.vy*dt;o.onGround=false;o.headHit=null;const pl=o.plat;o.plat=null;
  const x0=Math.floor(o.x-o.w+0.02),x1=Math.floor(o.x+o.w-0.02);
  if(o.vy<=0){
    const cy=Math.floor(ny);
    for(let cx=x0;cx<=x1;cx++){const c=cell(cx,cy);if(SOLID.has(c)||(c==='='&&prevY>=cy+1-0.002)){ny=cy+1;o.vy=0;o.onGround=true;o.groundCh=c;break}}
    if(!o.onGround)for(const p of plats){if(p.gone)continue;if(o.x+o.w>p.x+0.02&&o.x-o.w<p.x+p.w-0.02&&prevY>=p.py-0.06&&ny<=p.y){ny=p.y;o.vy=0;o.onGround=true;o.plat=p;o.groundCh='=';break}}
  }else{
    const cy=Math.floor(ny+o.h);let best=null,bd=9;
    for(let cx=x0;cx<=x1;cx++){const c=cell(cx,cy);if(SOLID.has(c)||(o.isMe&&c==='I')){const d=Math.abs(cx+0.5-o.x);if(d<bd){bd=d;best=[cx,cy]}}}
    if(best){ny=best[1]-o.h;o.vy=0;o.headHit=best}
  }
  o.y=ny;
}
function overlap(a,b,pad){pad=pad||0;return a.x+a.w+pad>b.x-b.w&&a.x-a.w-pad<b.x+b.w&&a.y+a.h+pad>b.y&&a.y-pad<b.y+b.h}

function setPower(p){me.power=p;me.h=p>0?1.62:0.85;$('bF').classList.toggle('hide',!(p===2&&isTouch))}
function updatePlayer(dt){
  const p=me;
  if(p.dead){p.deadT-=dt;if(p.deadT<1.6){p.vy-=40*dt;p.y+=p.vy*dt}return}
  if(p.win){updateWin(dt);return}
  p.inv=Math.max(0,p.inv-dt);p.candy=Math.max(0,p.candy-dt);p.jbuf=Math.max(0,p.jbuf-dt);p.fireCD=Math.max(0,p.fireCD-dt);
  const dir=inputDir();
  if(dir&&dir===p.lastDir)p.runT+=dt;else p.runT=0;p.lastDir=dir;
  const running=keys.ShiftLeft||keys.ShiftRight||p.runT>0.45;
  const maxS=running?9.5:6;const onIce=p.onGround&&p.groundCh==='i';
  if(dir){const turning=p.vx*dir<0;const a=p.onGround?(onIce?(turning?12:8):(turning?50:30)):26;p.vx+=dir*a*dt;if(Math.abs(p.vx)>maxS)p.vx=Math.sign(p.vx)*Math.max(maxS,Math.abs(p.vx)-30*dt);p.face=dir}
  else{const f=p.onGround?(onIce?3.5:34):4;p.vx=Math.sign(p.vx)*Math.max(0,Math.abs(p.vx)-f*dt)}
  if(p.onGround){p.coyote=0.1;p.combo=0}else p.coyote-=dt;
  if(p.jbuf>0&&p.coyote>0){p.vy=19+0.3*Math.abs(p.vx);p.jbuf=0;p.coyote=0;p.onGround=false;p.plat=null;p.sq=1.25;sfx('jump')}
  p.springT=Math.max(0,(p.springT||0)-dt);const g=(p.vy>0&&(jumpHeld()||p.springT>0))?GUP:GDOWN;p.vy=Math.max(-MAXFALL,p.vy-g*dt);
  // 平台携带
  for(const pl of plats)if(p.plat===pl){p.x+=pl.dx;p.y+=pl.dy}
  p.prevY=p.y;const wasG=p.onGround;
  p.isMe=true;moveBody(p,dt);
  if(p.onGround&&!wasG)p.sq=0.78;
  if(p.plat&&p.plat.type==='F'&&!p.plat.triggered){p.plat.triggered=true;p.plat.fall=0.5}
  if(p.headHit)hitBlock(p.headHit[0],p.headHit[1]);
  // 弹簧
  for(const s of springs){if(p.vy<=0&&Math.abs(p.x-s.x)<0.5+p.w&&p.prevY>=s.y+0.55&&p.y<=s.y+0.62){p.y=s.y+0.62;p.vy=jumpHeld()?28.5:27;p.springT=0.7;s.sq=1;sfx('spring');p.onGround=false}}
  // 危险格子
  const x0=Math.floor(p.x-p.w+0.05),x1=Math.floor(p.x+p.w-0.05),y0=Math.floor(p.y+0.05),y1=Math.floor(p.y+p.h-0.05);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const c=cell(cx,cy);if(c==='l'&&p.y<cy+0.75){die();return}if(c==='^'&&p.y<cy+0.55)hurt(true)}
  if(p.y<-1.5){die();return}
  if(p.x<p.w)p.x=p.w;
  // 收集
  for(const c of coinList)if(!c.got&&Math.abs(c.x-p.x)<0.45+p.w&&c.y>p.y-0.3&&c.y<p.y+p.h+0.3){c.got=true;gainCoin();setCoinInst(c,true)}
  for(const s of starList)if(!s.got&&Math.abs(s.x-p.x)<0.55+p.w&&s.y>p.y-0.45&&s.y<p.y+p.h+0.45){s.got=true;starsGot.push(s.id);s.mesh.visible=false;sfx('star');burst(s.x,s.y,'#ffd23f',14);pop('大星星 '+starsGot.length+'/3','#ffd23f',1.4)}
  for(const c of checks)if(!c.on&&p.x>c.x-0.3){c.on=true;c.flag.material.color.set(0x5fd06a);checkpoint={x:c.x,y:c.y};sfx('check');pop('存档点！','#8fffa0',1.2)}
  if(goal&&p.x+p.w>=goal.x-0.1&&p.y<goal.y+9.5){startWin();return}
  // 动画
  p.walk+=Math.abs(p.vx)*dt*2.4;p.sq+=(1-p.sq)*Math.min(1,dt*12);p.grow=Math.max(0,p.grow-dt);
}

  const m=new THREE.Mesh(geo('fb',()=>new THREE.SphereGeometry(0.2,10,8)),mat(0xffa21a,0xff5a00));world.add(m);
  fballs.push({x:me.x+me.face*0.4,y:me.y+me.h*0.55,w:0.18,h:0.36,vx:me.face*12,vy:-3,life:1.8,mesh:m});sfx('fire')}

function groundAhead(e,dir){const fx=Math.floor(e.x+dir*(e.w+0.05)),fy=Math.floor(e.y-0.1);const c=cell(fx,fy);if(SOLID.has(c)||c==='=')return true;for(const p of plats)if(fx>=p.x&&fx<p.x+p.w&&Math.abs(p.y-e.y)<0.2)return true;return false}

  for(const it of items){it.mesh.position.set(it.x,it.y,0);if(it.mesh.userData.spin)it.mesh.userData.spin.rotation.y+=dt*6;else it.mesh.rotation.y+=dt*2}
  for(const f of fballs)f.mesh.position.set(f.x,f.y+0.18,0);
  for(const b of bars)b.balls.forEach((m,k)=>m.position.set(b.cx+Math.cos(b.a)*k*0.5,b.cy+Math.sin(b.a)*k*0.5,0.3));
  for(const s of springs){s.sq=Math.max(0,s.sq-dt*4);s.top.position.y=0.55-s.sq*0.25}
  const spin=now/1000*3;Q.setFromAxisAngle(V.set(0,1,0),spin);
  for(const c of coinList)if(!c.got&&Math.abs(c.x-camX)<26){V.set(c.x,c.y,0);M4.compose(V,Q,S1);c.mesh.setMatrixAt(c.k,M4);c.mesh.instanceMatrix.needsUpdate=true}
  Q.set(0,0,0,1);
  for(const s of starList)if(!s.got){s.mesh.rotation.y=spin*0.7;s.mesh.position.y=s.y+Math.sin(spin)*0.08}
  for(const b of bumps){b.t+=dt;const d=Math.sin(Math.min(1,b.t/0.18)*Math.PI)*0.3;const ci=cellInst[b.cx+','+b.cy];if(ci)setInst(ci.key,ci.idx,b.cx,b.cy,d)}
  bumps=bumps.filter(b=>{if(b.t<0.18)return true;const ci=cellInst[b.cx+','+b.cy];if(ci)setInst(ci.key,ci.idx,b.cx,b.cy,0);return false});
  if(snowPts){const a=snowPts.geometry.attributes.position;for(let i=0;i<a.count;i++){let y=a.getY(i)-dt*1.6;if(y<-1)y+=20;a.setY(i,y)}a.needsUpdate=true;snowPts.position.set(camX,camY-8,0)}
  if(INST.lava){INST.lava.mesh.material.emissive.setHSL(0.04,1,0.38+Math.sin(now/300)*0.06)}
}

/* ============ HUD ============ */
const v3=new THREE.Vector3();
function drawHUD(dt){
  const s=hud.width/W;hx.setTransform(s,0,0,s,0,0);hx.clearRect(0,0,W,H);if(state==='menu'||!L)return;
  const ui=clamp(Math.min(W,H)/400,0.85,1.3),top=safeT+12,left=16+safeL;
  hx.textBaseline='middle';hx.lineWidth=5;hx.strokeStyle='rgba(20,40,90,.85)';hx.lineJoin='round';
  const txt=(t,x,y,size,c,al)=>{hx.textAlign=al||'left';hx.font='900 '+Math.round(size*ui)+'px sans-serif';hx.strokeText(t,x,y);hx.fillStyle=c||'#fff';hx.fillText(t,x,y)};
  txt('🍡 × '+Math.max(0,lives),left,top+12*ui,19);txt('🪙 '+coins,left+96*ui,top+12*ui,19,'#ffd23f');
  for(let i=0;i<3;i++){const st=starList[i];const got=st&&st.got;const old=st&&((save.lv[L.id]||{}).stars||0)&(1<<i);hx.globalAlpha=got?1:old?0.5:0.25;hx.font=Math.round(22*ui)+'px sans-serif';hx.textAlign='left';hx.fillText('⭐',left+i*28*ui,top+42*ui);hx.globalAlpha=1}
  const narrow=W<560;txt(L.id+' '+L.name,narrow?W-70:W/2,narrow?top+44*ui:top+12*ui,narrow?13:16,'#fff',narrow?'right':'center');
  if(me.candy>0)txt('彩虹无敌 '+Math.ceil(me.candy),W/2,top+36*ui,14,'#ff9de0','center');
  if(boss&&boss.active&&!boss.dead){const bw=Math.min(280,W*0.45);hx.fillStyle='rgba(0,0,0,.45)';hx.fillRect(W/2-bw/2,top+34*ui,bw,10);hx.fillStyle='#ff5a8a';hx.fillRect(W/2-bw/2,top+34*ui,bw*boss.hp/boss.max,10);txt('毛球大王',W/2,top+54*ui,13,'#fff','center')}
  let py=H*0.28;
  for(const p of pops){p.t-=dt;const a=clamp(Math.min(p.t*3,(p.max-p.t)*10),0,1);hx.globalAlpha=a;
    if(p.w){v3.copy(p.w);v3.y+=(p.max-p.t)*1.2;v3.project(camera);txt(p.text,(v3.x+1)/2*W,(1-v3.y)/2*H,18,p.color,'center')}else{txt(p.text,W/2,py,26,p.color,'center');py+=36*ui}}
  hx.globalAlpha=1;pops=pops.filter(p=>p.t>0);
  if(banner){banner.t-=dt;const a=clamp(Math.min(banner.t*2,(3.6-banner.t)*4),0,1);hx.globalAlpha=a;hx.fillStyle='rgba(20,50,110,.55)';const bw=Math.min(W-40,560*ui);hx.fillRect(W/2-bw/2,H*0.36-44*ui,bw,92*ui);txt(banner.title,W/2,H*0.36-16*ui,28,'#fff','center');txt(banner.tip,W/2,H*0.36+22*ui,14,'#e0efff','center');hx.globalAlpha=1;if(banner.t<=0)banner=null}
  if(me.dead&&lives<0)txt('游戏结束',W/2,H*0.45,40,'#ff8fb0','center');
  if(isTouch&&W<H&&lvT<5)txt('横过来玩更舒服哦 ↻',W/2,H*0.2,15,'#fff','center');
}

/* ============ 界面 ============ */
function showScreen(id){for(const s of['menu','pause','clear'])$(s).hidden=s!==id}
function openMenu(){
  state='menu';GameMusic.play(MUSIC('menu'),{fade:0.5});$('ctrl').classList.add('hide');showScreen('menu');applyAudio();
  const wl=$('worlds');wl.innerHTML='';let total=0;
  WORLDS.forEach(w=>{const d=document.createElement('div');d.className='world';d.innerHTML='<h3>'+w.name+'</h3>';const g=document.createElement('div');g.className='lvls';
    for(const i of w.lv){const Lv=LEVELS[i],rec=save.lv[Lv.id]||{stars:0};total+=bits(rec.stars||0);const unlocked=save.unlockAll||i===0||(save.lv[LEVELS[i-1].id]||{}).done;
      const b=document.createElement('button');b.className='lvl'+(unlocked?'':' lock');b.style.background=w.c;
      b.innerHTML='<small>'+Lv.id+(Lv.boss?' · 首领战':'')+'</small><b>'+(unlocked?'':'🔒 ')+Lv.name+'</b><div class="st">'+'★'.repeat(bits(rec.stars||0))+'☆'.repeat(3-bits(rec.stars||0))+'</div>'+(rec.best?'<small>最佳 '+rec.best.toFixed(1)+'s</small>':'');
      b.onclick=()=>{initAudio();sfx('click');if(!unlocked){b.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:220});return}lives=5;startLevel(i)};g.appendChild(b)}
    d.appendChild(g);wl.appendChild(d)});
  $('starTotal').textContent='⭐ '+total+' / '+LEVELS.length*3;
  if(!L){loadLevel(0)}
}
function startLevel(i,keep){
  initAudio();if(!keep){checkpoint=null;starsGot=[];coins=0}
  const power=keep?0:0;loadLevel(i,keep);setPower(power);
  state='play';showScreen(null);$('ctrl').classList.remove('hide');
  for(const id of['pad','bJ'])$(id).classList.toggle('hide',!isTouch);
  GameMusic.play(lvMusic(),{fade:0.4});last=performance.now();
  if(!keep)banner={title:L.id+' '+L.name,tip:L.tip||'',t:3.6};
}
function openPause(){if(state!=='play')return;state='pause';GameMusic.pause();$('pTitle').textContent=L.id+' '+L.name;showScreen('pause');applyAudio()}
function resume(){showScreen(null);state='play';GameMusic.resume();last=performance.now()}
$('pResume').onclick=resume;$('pRestart').onclick=()=>{lives=Math.max(lives,1);startLevel(lvIdx)};$('pQuit').onclick=()=>openMenu();
$('cNext').onclick=()=>startLevel(lvIdx+1);$('cAgain').onclick=()=>startLevel(lvIdx);$('cMenu').onclick=()=>openMenu();
function tog(k){initAudio();save[k]=save[k]?0:1;persist();applyAudio()}
$('tMusic').onclick=$('tMusic2').onclick=()=>tog('music');$('tSfx').onclick=$('tSfx2').onclick=()=>tog('sfx');$('tQual').onclick=()=>{tog('hq');resize()};
$('tFree').onclick=()=>{initAudio();save.unlockAll=1;persist();sfx('power');openMenu()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)openPause()});

/* ============ 主循环 ============ */
let last=performance.now(),acc=0,menuT=0;
function step(dt){
  if(state!=='play')return;
  if(!me.dead&&!me.win)lvT+=dt;
  updatePlats(dt);updatePlayer(dt);updateEnemies(dt);updateItems(dt);
  if(me.dead&&me.deadT<=0){
    if(lives<0){lives=5;checkpoint=null;starsGot=[];coins=0;openMenu();return}
    startLevel(lvIdx,true);GameMusic.play(lvMusic(),{fade:0.4,restart:true});
  }
}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state==='play'||state==='clear'){if(state==='play'){acc+=dt;let n=0;while(acc>=1/120&&n<10){step(1/120);acc-=1/120;n++}}syncHero(dt);updateCamera(dt);syncWorld(dt,now)}
  else if(state==='menu'&&L){menuT+=dt;me.x=8+((menuT*3)%40);me.face=1;me.vx=4;me.onGround=true;me.walk+=dt*10;syncHero(dt);updateCamera(dt);syncWorld(dt,now)}
  updateParts(dt);renderer.render(scene,camera);drawHUD(dt);requestAnimationFrame(frame);
}
openMenu();requestAnimationFrame(frame);
</script>
