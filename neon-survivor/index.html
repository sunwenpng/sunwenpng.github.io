<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070b14">
<title>霓虹幸存者 3D</title>
<meta name="description" content="原创割草射击：自动开火、三选一升级、冲刺完美闪避、契约卡、Boss 战。">
<style>
:root{--bg:#070b14;--panel:#111a2e;--panel2:#18233d;--line:rgba(140,200,255,.18);--fg:#eaf2ff;--muted:#8fa0bf;--cyan:#5cf2ff;--pink:#ff5cc8;--gold:#ffd166;--purple:#b388ff;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#probe{position:fixed;visibility:hidden;pointer-events:none;inset:0;padding:var(--st) var(--sr) var(--sb) var(--sl)}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 16px) max(16px,var(--sr)) calc(var(--sb) + 16px) max(16px,var(--sl));background:rgba(4,7,14,.78);backdrop-filter:blur(3px);z-index:10;overflow:auto}
.screen[hidden]{display:none}
.box{width:100%;max-width:560px;margin:auto}
h1{margin:0;font-size:clamp(34px,9vw,56px);letter-spacing:.06em;text-align:center;background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(92,242,255,.35))}
h2{margin:0 0 12px;font-size:24px;text-align:center}
.sub{color:var(--muted);text-align:center;font-size:13px;margin:6px 0 16px;line-height:1.6}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:12px 18px;font-size:16px;font-weight:700;min-height:48px}
.btn.primary{background:linear-gradient(135deg,#1aa7c9,#8a3ffc);border-color:transparent;box-shadow:0 6px 24px rgba(92,242,255,.25)}
.btn.small{padding:8px 12px;font-size:14px;min-height:40px}
.btn:disabled{opacity:.45;cursor:default}
.coins{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
.chars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.char{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px;text-align:left;display:flex;gap:10px;align-items:center;min-height:70px}
.char.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset,0 0 18px rgba(92,242,255,.25)}
.char .dot{flex:0 0 34px;height:34px;border-radius:50%}
.char b{display:block;font-size:15px}
.char small{color:var(--muted);font-size:12px;line-height:1.35;display:block}
.char.lock{opacity:.7}
.best{color:var(--muted);font-size:13px;text-align:center;margin-top:12px}
.shop{display:grid;gap:8px;margin:10px 0 14px}
.shopItem{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.shopItem .n{flex:1;min-width:0}
.shopItem b{font-size:15px}
.shopItem small{display:block;color:var(--muted);font-size:12px}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:14px;height:5px;border-radius:3px;background:#243150}
.pips i.on{background:var(--cyan)}
.cards{display:grid;gap:10px;margin:8px 0 12px}
.card{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px 14px;min-height:76px;animation:pop .25s both}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}
@keyframes pop{from{transform:translateY(12px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.card .ic{flex:0 0 46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:900;color:#06101e}
.card b{font-size:16px}
.card .lv{font-size:12px;color:var(--gold);margin-left:6px;font-weight:700}
.card .new{font-size:11px;color:#06101e;background:var(--gold);border-radius:6px;padding:1px 6px;margin-left:6px}
.card p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.card.curse{border-color:rgba(179,136,255,.6);background:linear-gradient(135deg,#1e1435,#141a30)}
.card.evo{border:2px solid #ffd166;background:linear-gradient(135deg,#3a2a08,#1a1430 60%,#2a1040);box-shadow:0 0 22px rgba(255,209,102,.45);animation:pop .25s both,evoGlow 1.2s ease-in-out infinite alternate}
.card.evo b{color:#ffd166}
@keyframes evoGlow{to{box-shadow:0 0 34px rgba(255,209,102,.8)}}
.evoRow{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px}.evoRow .ic{flex:0 0 36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:900;color:#06101e}.evoRow small{display:block;color:var(--muted);font-size:12px}
.card.curse b{color:var(--purple)}
@media (hover:hover){.card:hover,.char:hover,.btn:hover{filter:brightness(1.15)}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
#hudBtns{position:fixed;top:calc(var(--st) + 22px);right:calc(var(--sr) + 10px);z-index:5;display:flex;gap:8px}
.hb{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(7,11,20,.6);font-size:16px;font-weight:800}
#touchBtns{position:fixed;right:calc(var(--sr) + 18px);bottom:calc(var(--sb) + 22px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:12px}
.tb{border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(10,18,34,.55);font-weight:900;display:grid;place-items:center;backdrop-filter:blur(2px)}
#btnUlt{width:64px;height:64px;font-size:14px;background:conic-gradient(rgba(255,92,200,.55) calc(var(--u,0)*1%),rgba(10,18,34,.55) 0)}
#btnUlt.ready{border-color:var(--pink);box-shadow:0 0 20px var(--pink);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#btnDash{width:78px;height:78px;font-size:15px}
#btnDash.cd{opacity:.5}
.hide{display:none!important}
.keys{color:var(--muted);font-size:12px;text-align:center;margin-top:10px;line-height:1.6}
.toggle{display:flex;gap:8px;justify-content:center;margin-top:10px}
a.back{color:var(--muted);font-size:13px;text-decoration:none;display:block;text-align:center;margin-top:14px}
.chestList{display:grid;gap:8px;margin:10px 0 16px}
.btn.free{background:linear-gradient(135deg,#f5a524,#e0457b);border-color:transparent;color:#fff}
.dmgRow{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}.dmgRow span{flex:0 0 64px;color:var(--muted)}.dmgRow i{display:block;height:10px;border-radius:5px}.dmgRow b{font-size:12px;font-variant-numeric:tabular-nums;color:var(--fg);margin-left:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 12px}
.statGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-size:12px;color:var(--muted)}.statGrid b{color:var(--fg);font-weight:700}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>

<div id="hudBtns" class="hide"><button class="hb" id="btnPause" aria-label="暂停">II</button></div>
<div id="touchBtns" class="hide">
  <button class="tb" id="btnUlt" aria-label="超载大招">超载</button>
  <button class="tb" id="btnDash" aria-label="冲刺">冲刺</button>
</div>

<div class="screen" id="menu">
  <div class="box">
    <h1>霓虹幸存者</h1>
    <p class="sub">撑过 8 分钟，击败三只首领。<br>武器自动开火，你只管走位、冲刺、放大招。</p>
    <div class="row"><span>金币 <span class="coins" id="menuCoins">0</span></span></div>
    <div class="chars" id="charList"></div>
    <div class="row">
      <button class="btn primary" id="btnStart" style="min-width:180px">开始</button>
      <button class="btn" id="btnShop">强化</button>
      <button class="btn" id="btnEvo">进化图鉴</button>
    </div>
    <div class="best" id="bestLine"></div>
    <div class="keys">手机：按住屏幕任意处拖动移动，右下角冲刺 / 超载<br>电脑：WASD / 方向键移动，空格冲刺，E 超载，P 暂停，升级时按 T 全部拿走</div>
    <div class="toggle"><button class="btn small" id="btnMusic">音乐：开</button><button class="btn small" id="btnSfx">音效：开</button><button class="btn small" id="btnNums">伤害数字：开</button><button class="btn small" id="btnShake">震屏：开</button></div>
    <div class="toggle"><button class="btn small free" id="btnFree">🎁 免费全解锁</button></div>
    <a class="back" href="../">← 返回游戏大厅</a>
  </div>
</div>

<div class="screen" id="shopScreen" hidden>
  <div class="box">
    <h2>永久强化</h2>
    <p class="sub">金币 <span class="coins" id="shopCoins">0</span> · 每局结算获得金币</p>
    <div class="shop" id="shopList"></div>
    <div class="row"><button class="btn" id="btnShopBack">返回</button></div>
  </div>
</div>

<div class="screen" id="evoScreen" hidden>
  <div class="box">
    <h2>超级进化图鉴</h2>
    <p class="sub">武器升到 Lv5，并且拥有对应的被动道具，升级时就会出现金色的「超级进化」卡。<br>打精英怪掉的宝箱也会优先给你进化。</p>
    <div class="shop" id="evoList"></div>
    <div class="row"><button class="btn" id="btnEvoBack">返回</button></div>
  </div>
</div>

<div class="screen" id="levelup" hidden>
  <div class="box">
    <h2 id="luTitle">升级！选择一项</h2>
    <div class="cards" id="cardList"></div>
    <div class="row"><button class="btn small free" id="btnTakeAll">🎁 全部拿走（免费）</button><button class="btn small" id="btnReroll">刷新（剩 1 次）</button></div>
  </div>
</div>

<div class="screen" id="chest" hidden>
  <div class="box">
    <h2 id="chestTitle">精英宝箱</h2>
    <div class="chestList" id="chestList"></div>
    <div class="row"><button class="btn primary" id="btnChestOk">收下</button></div>
  </div>
</div>

<div class="screen" id="pause" hidden>
  <div class="box">
    <h2>暂停</h2>
    <div class="cards" id="pauseBuild"></div>
    <div class="row">
      <button class="btn primary" id="btnResume">继续</button>
      <button class="btn" id="btnQuit">结束本局</button>
    </div>
    <div class="toggle"><button class="btn small" id="btnMusic2">音乐</button><button class="btn small" id="btnSfx2">音效</button><button class="btn small" id="btnNums2">伤害数字</button><button class="btn small" id="btnShake2">震屏</button></div>
  </div>
</div>

<div class="screen" id="result" hidden>
  <div class="box">
    <h2 id="resTitle">倒下了</h2>
    <p class="sub" id="resSub"></p>
    <div class="stats" id="resStats"></div>
    <div class="row">
      <button class="btn primary" id="btnAgain">再来一局</button>
      <button class="btn" id="btnMenu">返回菜单</button>
    </div>
  </div>
</div>

<script src="../lib/three.min.js"></script>
<script src="../lib/music.js"></script>
<script>
'use strict';
/* ================= 基础 ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,DPR=1,zoom=1,safeT=0,safeB=0,safeL=0,safeR=0;
const isTouch=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  zoom=Math.min(W,H)/560; if(Math.max(W,H)/zoom>1100) zoom=Math.max(W,H)/1100;
  const cs=getComputedStyle($('probe'));
  safeT=parseFloat(cs.paddingTop)||0;safeB=parseFloat(cs.paddingBottom)||0;safeL=parseFloat(cs.paddingLeft)||0;safeR=parseFloat(cs.paddingRight)||0;
}
addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
function pickW(arr){let s=0;for(const a of arr)s+=a[1];let r=Math.random()*s;for(const a of arr){r-=a[1];if(r<=0)return a[0]}return arr[arr.length-1][0]}
function fmtTime(t){t=Math.max(0,Math.floor(t));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}

/* ================= 存档 ================= */
const SAVE_KEY='neon-survivor-v1';
const DEF_SAVE={coins:0,up:{},chars:{ace:1},char:'ace',best:{time:0,kills:0,lv:0,win:0},runs:0,music:1,sfx:1,nums:1,shake:1};
function loadSave(){
  try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s&&typeof s==='object')return Object.assign({},DEF_SAVE,s,{up:Object.assign({},s.up||{}),chars:Object.assign({ace:1},s.chars||{}),best:Object.assign({},DEF_SAVE.best,s.best||{})});
  }catch(e){}
  return JSON.parse(JSON.stringify(DEF_SAVE));
}
let save=loadSave();
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

/* ================= 数据 ================= */
const META=[
  {id:'hp',name:'强韧',desc:'最大生命 +12',max:5,cost:l=>60+l*60},
  {id:'dmg',name:'火力',desc:'伤害 +6%',max:5,cost:l=>80+l*70},
  {id:'spd',name:'机动',desc:'移速 +4%',max:5,cost:l=>60+l*50},
  {id:'mag',name:'磁场',desc:'拾取范围 +15%',max:5,cost:l=>40+l*40},
  {id:'cd',name:'急速',desc:'冷却 -3%',max:5,cost:l=>90+l*80},
  {id:'gold',name:'财运',desc:'金币获取 +12%',max:5,cost:l=>70+l*60},
  {id:'reroll',name:'洞察',desc:'每局刷新次数 +1',max:3,cost:l=>120+l*120},
  {id:'revive',name:'不屈',desc:'每局可复活一次（半血）',max:1,cost:()=>500},
];
const CHARS=[
  {id:'ace',name:'启明',color:'#5cf2ff',weapon:'pulse',perk:'脉冲枪 · 暴击率 +8%',cost:0,apply:s=>{s.crit+=0.08}},
  {id:'frost',name:'霜语',color:'#9fd0ff',weapon:'nova',perk:'霜环 · 移速 +10%',cost:300,apply:s=>{s.spd*=1.1}},
  {id:'volt',name:'雷鸣',color:'#ffe066',weapon:'chain',perk:'雷链 · 冷却 -10%',cost:600,apply:s=>{s.cd*=0.9}},
  {id:'tank',name:'铁壁',color:'#ff9f5c',weapon:'blades',perk:'环绕刃 · 生命 +40 护甲 +1',cost:900,apply:s=>{s.maxHp+=40;s.armor+=1}},
];
const WEAPONS={
  pulse:{name:'脉冲枪',icon:'脉',color:'#5cf2ff',desc:['向最近的敌人射出能量弹','弹数 +1','伤害 +30%','穿透 +1，弹数 +1','冷却 -25%，弹数 +1']},
  blades:{name:'环绕刃',icon:'刃',color:'#ff9f5c',desc:['两把光刃环绕身边切割敌人','光刃 +1','伤害 +40%','光刃 +1，转速提升','光刃 +1，半径 +25%']},
  chain:{name:'雷链',icon:'雷',color:'#ffe066',desc:['闪电劈中敌人并跳向附近目标','跳跃 +2','伤害 +35%','冷却 -20%，跳跃 +2','每次释放两道闪电']},
  nova:{name:'霜环',icon:'霜',color:'#9fd0ff',desc:['周期释放寒冰冲击，减速敌人','范围 +20%','伤害 +40%','冷却 -20%','冻结敌人 0.6 秒，范围 +20%']},
  missile:{name:'追踪弹',icon:'导',color:'#ff5cc8',desc:['发射追踪导弹，命中后爆炸','导弹 +1','爆炸范围 +30%','导弹 +1，伤害 +30%','冷却 -30%，导弹 +1']},
  mines:{name:'光雷',icon:'爆',color:'#80ed99',desc:['在脚下布置感应光雷','爆炸范围 +25%','伤害 +40%','冷却 -25%','每次布置两颗']},
  laser:{name:'棱光',icon:'光',color:'#b388ff',desc:['朝敌人扫射一道贯穿光束','持续 +40%','伤害 +40%','宽度 +50%','同时射出两道光束']},
};
/* 超级进化：武器满级（Lv5）+ 拥有对应被动 → 升级时出现金色进化卡 */
const EVOS={
  pulse:{with:'multi',name:'星爆脉冲',icon:'星',color:'#ffd166',desc:'向四周爆射 12 发金色穿透弹，伤害 ×1.6'},
  blades:{with:'swift',name:'风暴刃环',icon:'岚',color:'#d17bff',desc:'光刃 +4，半径与转速大增，伤害 ×1.8，击退更强'},
  chain:{with:'haste',name:'雷霆风暴',icon:'霆',color:'#fff36b',desc:'同时落下 4 道闪电，跳跃 10 次，伤害 ×2，冷却更短'},
  nova:{with:'area',name:'绝对零度',icon:'冰',color:'#e8fbff',desc:'寒冰冲击范围 ×1.8，伤害 ×2.2，冻结 1.5 秒'},
  missile:{with:'might',name:'星陨导弹群',icon:'陨',color:'#ff7ad9',desc:'导弹 +4，爆炸范围 ×1.6，伤害 ×1.8，发射更快'},
  mines:{with:'armor',name:'黑洞地雷',icon:'洞',color:'#7a5cff',desc:'地雷会把周围敌人吸过来再爆炸，范围 ×1.8，伤害 ×2.5'},
  laser:{with:'crit',name:'天穹棱镜',icon:'穹',color:'#ff5cc8',desc:'同时 4 道光束旋转扫射整圈，伤害 ×2'},
};
const PASSIVES={
  might:{name:'强化弹头',icon:'力',color:'#ff6b6b',max:5,desc:'伤害 +10%'},
  swift:{name:'疾风靴',icon:'速',color:'#4cc9f0',max:5,desc:'移速 +8%'},
  haste:{name:'超频芯片',icon:'频',color:'#ffd166',max:5,desc:'冷却 -7%'},
  area:{name:'扩散器',icon:'域',color:'#9b5de5',max:5,desc:'范围 +10%'},
  magnet:{name:'磁力线圈',icon:'磁',color:'#00f5d4',max:5,desc:'拾取范围 +30%'},
  armor:{name:'纳米装甲',icon:'甲',color:'#adb5bd',max:5,desc:'护甲 +1，最大生命 +10'},
  regen:{name:'再生胶囊',icon:'愈',color:'#80ed99',max:5,desc:'每秒回复 +0.5 生命'},
  crit:{name:'暴击模块',icon:'暴',color:'#ff5cc8',max:5,desc:'暴击率 +7%'},
  multi:{name:'分裂核心',icon:'多',color:'#f15bb5',max:2,desc:'所有武器投射物 +1'},
  wisdom:{name:'学识',icon:'智',color:'#fee440',max:5,desc:'经验获取 +10%'},
};
const CURSES=[

const spriteCache={};
function shapePath(c,shape,r){
  c.beginPath();
  if(shape==='circle'){c.arc(0,0,r,0,TAU)}
  else{
    const n={tri:3,square:4,diamond:4,pent:5,hex:6}[shape]||6;
    const off=shape==='square'?Math.PI/4:shape==='tri'?0:-Math.PI/2;
    for(let i=0;i<n;i++){const a=off+i*TAU/n;const x=Math.cos(a)*r,y=Math.sin(a)*r;i?c.lineTo(x,y):c.moveTo(x,y)}
    c.closePath();
  }
}
function sprite(shape,color,r,white){
  const k=shape+color+r+(white?'w':'');if(spriteCache[k])return spriteCache[k];
  const g=Math.ceil(r*0.9)+6,s=Math.ceil((r+g)*2),c=document.createElement('canvas');c.width=c.height=s;
  const x=c.getContext('2d');x.translate(s/2,s/2);
  x.shadowColor=white?'#fff':color;x.shadowBlur=g;
  shapePath(x,shape,r);x.fillStyle=white?'#ffffff':color;x.globalAlpha=white?1:.28;x.fill();
  x.globalAlpha=1;x.lineWidth=Math.max(2,r*0.18);x.strokeStyle=white?'#fff':color;x.stroke();
  x.shadowBlur=0;shapePath(x,shape,r*0.42);x.fillStyle=white?'#fff':color;x.fill();
  spriteCache[k]=c;return c;
}
function glowDot(color,r){
  const k='dot'+color+r;if(spriteCache[k])return spriteCache[k];
  const s=r*6,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
  const gr=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);gr.addColorStop(0,'#fff');gr.addColorStop(.18,color);gr.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=gr;x.fillRect(0,0,s,s);spriteCache[k]=c;return c;
}

let AC=null,master=null,musicGain=null,sfxGain=null,noiseBuf=null;
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=save.music?0.16:0;musicGain.connect(master);
  sfxGain=AC.createGain();sfxGain.gain.value=save.sfx?0.5:0;sfxGain.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
const sfxLast={};
function tone(f,dur,type,vol,slide,when){
  if(!AC||!save.sfx)return;const t=when||AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(sfxGain);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol,freq,when){
  if(!AC||!save.sfx)return;const t=when||AC.currentTime;
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(freq||1200,t);f.frequency.exponentialRampToValueAtTime(80,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(sfxGain);s.start(t);s.stop(t+dur);
}
function sfx(name,arg){
  if(!AC||!save.sfx)return;const now=AC.currentTime;const gap={shoot:.07,hit:.045,gem:.03,boom:.06,zap:.08}[name]||0;
  if(gap&&sfxLast[name]&&now-sfxLast[name]<gap)return;sfxLast[name]=now;
  switch(name){
    case 'shoot':tone(1300,.04,'square',.025,.5);break;
    case 'hit':tone(220+Math.random()*60,.05,'triangle',.06,.5);break;
    case 'gem':tone(660*Math.pow(1.0595,Math.min(24,arg||0)),.07,'sine',.07);break;
    case 'boom':noise(.28,.22,900);tone(120,.25,'sine',.15,.4);break;
    case 'zap':noise(.08,.1,4000);tone(1800,.08,'sawtooth',.03,.3);break;
    case 'hurt':tone(300,.2,'sawtooth',.12,.35);break;
    case 'dash':noise(.18,.12,2500);break;
    case 'perfect':[880,1320,1760].forEach((f,i)=>tone(f,.25,'sine',.08,1,now+i*.05));break;
    case 'level':[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.09,1,now+i*.07));break;
    case 'ult':noise(.8,.35,2000);tone(80,.8,'sine',.3,.3);[1047,1319,1568].forEach((f,i)=>tone(f,.4,'triangle',.06,1,now+i*.06));break;
    case 'boss':tone(70,1.2,'sawtooth',.18,1.6);tone(105,1.2,'sawtooth',.12,1.6);break;
    case 'coin':tone(1568,.06,'square',.04);tone(2093,.1,'square',.04,1,now+.05);break;
    case 'chest':[392,523,659,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.08,1,now+i*.06));break;
    case 'click':tone(900,.04,'square',.04);break;
  }
}
/* 简易背景音乐：A 小调循环 */
let musicTimer=null,musicStep=0,musicNext=0,musicIntense=0;
const CHORDS=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function mnote(f,t,dur,type,vol,cut){
  const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=cut||2000;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(fl);fl.connect(g);g.connect(musicGain);o.start(t);o.stop(t+dur+0.05);
}
function musicTick(){
  if(!AC)return;const spb=60/118/4;
  while(musicNext<AC.currentTime+0.2){
    const t=musicNext,s=musicStep%64,ch=CHORDS[Math.floor(s/16)];
    if(s%2===0)mnote(mtof(ch[0]-24),t,spb*1.8,'sawtooth',0.22,500+musicIntense*300);
    const arp=[0,1,2,1,2,0,2,1];mnote(mtof(ch[arp[s%8]]+12+(s%16>=8?12:0)),t,spb*0.9,'square',0.05,2200);
    if(s%4===0){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+0.16)}
    if(s%4===2&&musicIntense>0){const b=AC.createBufferSource();b.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=6000;const g=AC.createGain();g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);b.connect(f);f.connect(g);g.connect(musicGain);b.start(t);b.stop(t+0.06)}
    musicNext+=spb;musicStep++;
  }
}

function updateSpawns(dt){
  const t=run.t;

  if(run.bossIdx<BOSSES.length&&t>=BOSSES[run.bossIdx].t&&!run.boss){spawnBoss(BOSSES[run.bossIdx]);run.bossIdx++}
  if(t>=run.nextElite){spawnElite();run.nextElite+=45}
  if(run.swarms.length&&t>=run.swarms[0]){run.swarms.shift();spawnSwarm()}

  let rate=(1.0+t*0.022)*run.stats.spawn;if(run.boss)rate*=0.5;

  const x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=grid.get(gkey(cx,cy));if(a)for(let i=0;i<a.length;i++){if(cb(a[i])===false)return}}

function damage(e,amt,o){
  if(e.dead)return;o=o||{};

  if(!o.noCrit&&Math.random()<run.stats.crit){crit=true;amt*=run.stats.critMul}
  amt*=run.stats.dmg;
  if(o.src)run.wdmg[o.src]=(run.wdmg[o.src]||0)+amt;
  if(e.shield>0){const a=Math.min(e.shield,amt);e.shield-=a;amt-=a*0.7}
  e.hp-=amt;run.dmgDealt+=amt;e.flash=0.08;
  if(o.kb&&!e.boss){const k=o.kb/(e.mass||1);e.kx+=Math.cos(o.ang)*k;e.ky+=Math.sin(o.ang)*k}
  if(save.nums&&nums.length<70&&(amt>=4||crit))nums.push({x:e.x+rand(-6,6),y:e.y-e.r,v:Math.round(amt),t:0.6,crit});

}
function kill(e){

    items.push({x:e.x,y:e.y,type:'chest',big:true});

    if(e.boss.final){run.won=true;setTimeout(()=>{if(state==='play'||state==='chest'||state==='levelup')endRun(true)},1800)}
    return;
  }

  else{

/* ================= 更新 ================= */
function update(dt){
  run.t+=dt;const S=run.stats;
  // 玩家
  const[ix,iy]=inputDir();
  if(ix||iy){const d=Math.hypot(ix,iy);P.fx=ix/d;P.fy=iy/d}
  if(P.dashT>0){P.dashT-=dt;P.vx=P.dx*S.spd*3.4;P.vy=P.dy*S.spd*3.4;if(Math.random()<0.8)parts.push({x:P.x,y:P.y,vx:0,vy:0,t:0.25,c:'#5cf2ff',s:5})}
  else{P.vx+=(ix*S.spd-P.vx)*Math.min(1,dt*14);P.vy+=(iy*S.spd-P.vy)*Math.min(1,dt*14)}
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  P.dashCd=Math.max(0,P.dashCd-dt);P.iframe=Math.max(0,P.iframe-dt);P.hitFlash=Math.max(0,P.hitFlash-dt);
  if(S.regen>0)P.hp=Math.min(S.maxHp,P.hp+S.regen*dt);
  // 镜头
  cam.x+=(P.x-cam.x)*Math.min(1,dt*10);cam.y+=(P.y-cam.y)*Math.min(1,dt*10);cam.shake=Math.max(0,cam.shake-dt*40);

  updateSpawns(dt);
  buildGrid();
  for(const id in run.weapons)WUPD[id](run.wstate[id]||(run.wstate[id]={t:0.3,a:0}),run.weapons[id],dt);

  // 敌人
  const[hw,hh]=viewHalf();const farX=hw*2.2,farY=hh*2.2;
  for(const e of enemies){
    if(e.dead)continue;
    e.flash=Math.max(0,e.flash-dt);
    if(e.slowT>0){e.slowT-=dt;if(e.slowT<=0)e.slow=0}
    let sp=e.spd*(1-e.slow);if(e.freeze>0){e.freeze-=dt;sp=0}
    if(e.rage&&e.hp<e.maxHp*0.5)sp*=1.7;
    let dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
    if(!e.boss&&(Math.abs(dx)>farX||Math.abs(dy)>farY)){const[nx,ny]=spawnPos();e.x=nx;e.y=ny;continue}
    let mx=dx/d,my=dy/d;
    if(e.boss)updateBoss(e,dt,d,mx,my);
    else{
      if(e.ranged){
        if(d<220){mx=-mx;my=-my}else if(d<270){mx=-my*0.6;my=dx/d*0.6}
        e.cd-=dt;if(e.cd<=0&&d<420){e.cd=rand(2.2,3);const a=Math.atan2(dy,dx);ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,r:5,dmg:8*(1+run.t/300),life:4,c:'#4cc9f0'})}
      }
      if(e.bomb){
        if(e.fuse<0&&d<46+e.r)e.fuse=0.55;
        if(e.fuse>=0){e.fuse-=dt;sp*=0.2;if(e.fuse<=0){e.fuse=0;kill(e);continue}}
      }
      e.x+=(mx*sp+e.kx)*dt;e.y+=(my*sp+e.ky)*dt;
    }
    e.kx*=Math.pow(0.002,dt);e.ky*=Math.pow(0.002,dt);
    e.ang+=dt*2;
    // 互相推开
    near(e.x,e.y,e.r+20,o=>{
      if(o===e||o.dead)return;const ox=e.x-o.x,oy=e.y-o.y,rr=e.r+o.r;const dd=ox*ox+oy*oy;
      if(dd<rr*rr&&dd>0.01){const q=Math.sqrt(dd),push=(rr-q)*0.5,w=o.mass/(o.mass+e.mass);e.x+=ox/q*push*w;e.y+=oy/q*push*w}
    });
    // 接触伤害
    dx=P.x-e.x;dy=P.y-e.y;
    if(e.dmg>0&&dx*dx+dy*dy<(e.r+P.r-2)**2)hurt(e.dmg,e);
  }
  // 敌方子弹
  for(const b of ebullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    const dx=P.x-b.x,dy=P.y-b.y;if(dx*dx+dy*dy<(b.r+P.r-3)**2){if(P.dashT>0){perfectDodge()}else if(P.iframe<=0){hurt(b.dmg);b.life=0}}
  }
  ebullets=ebullets.filter(b=>b.life>0);
  // 我方子弹
  for(const b of pbullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    near(b.x,b.y,b.r+30,e=>{
      if(e.dead||b.pierce<=0||b.hit.includes(e.id))return;const dx=e.x-b.x,dy=e.y-b.y;
      if(dx*dx+dy*dy<(e.r+b.r)**2){b.hit.push(e.id);b.pierce--;damage(e,b.dmg,{kb:60,ang:Math.atan2(b.vy,b.vx),src:b.src});if(b.pierce<=0){b.life=0;return false}}
    });
  }
  pbullets=pbullets.filter(b=>b.life>0);
  // 导弹
  for(const m of missiles){
    m.life-=dt;if(!m.tgt||m.tgt.dead)m.tgt=nearest(m.x,m.y,500);
    if(m.tgt){const a=Math.atan2(m.tgt.y-m.y,m.tgt.x-m.x),ca=Math.atan2(m.vy,m.vx);let da=a-ca;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;const na=ca+clamp(da,-6*dt,6*dt);const sp=Math.min(460,Math.hypot(m.vx,m.vy)+600*dt);m.vx=Math.cos(na)*sp;m.vy=Math.sin(na)*sp}
    m.x+=m.vx*dt;m.y+=m.vy*dt;m.trail-=dt;if(m.trail<=0){m.trail=0.02;parts.push({x:m.x,y:m.y,vx:0,vy:0,t:0.3,c:'#ff5cc8',s:3})}
    let hitE=false;near(m.x,m.y,40,e=>{if(!e.dead&&(e.x-m.x)**2+(e.y-m.y)**2<(e.r+6)**2){hitE=true;return false}});
    if(hitE||m.life<=0){m.life=0;explode(m.x,m.y,m.blast,m.dmg,'#ff5cc8','missile')}
  }
  missiles=missiles.filter(m=>m.life>0);
  // 地雷
  for(const m of mines){
    m.life-=dt;m.arm-=dt;if(m.arm>0)continue;
    if(m.evo&&m.fuse>=0){m.fuse-=dt;near(m.x,m.y,m.r*1.4,e=>{if(e.dead||e.boss)return;const dx=m.x-e.x,dy=m.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*260*dt;e.y+=dy/d*260*dt});if(m.fuse<=0){m.life=0;explode(m.x,m.y,m.r,m.dmg,'#7a5cff','mines')}continue}
    let trig=false;near(m.x,m.y,30,e=>{if(!e.dead&&(e.x-m.x)**2+(e.y-m.y)**2<(e.r+12)**2){trig=true;return false}});
    if(trig){if(m.evo){m.fuse=0.9;tone(90,0.9,'sine',0.12,0.5)}else{m.life=0;explode(m.x,m.y,m.r,m.dmg,'#80ed99','mines')}}
  }
  mines=mines.filter(m=>m.life>0);
  // 冲击环
  for(const r of rings){
    if(r.follow){r.x=P.x;r.y=P.y}
    r.r+=r.speed*dt;
    near(r.x,r.y,r.r,e=>{
      if(e.dead||e.novaId===r.id)return;const d=Math.hypot(e.x-r.x,e.y-r.y);
      if(d<r.r+e.r){e.novaId=r.id;if(r.slow){e.slow=r.slow;e.slowT=1.6}if(r.freeze&&!e.boss)e.freeze=r.freeze;damage(e,r.dmg,{kb:r.ult?400:120,ang:Math.atan2(e.y-r.y,e.x-r.x),noCrit:r.ult,src:r.ult?'ult':'nova'})}
    });
  }
  rings=rings.filter(r=>r.r<r.max);
  // 激光
  for(const L of lasers){
    L.t+=dt;L.tick-=dt;const a=L.a+L.da*(L.t/L.dur);L.cur=a;
    if(L.tick<=0){L.tick=0.08;const cx=Math.cos(a),cy=Math.sin(a);
      for(const e of enemies){if(e.dead)continue;const ex=e.x-P.x,ey=e.y-P.y,proj=ex*cx+ey*cy;if(proj<0||proj>L.len)continue;const perp=Math.abs(ex*cy-ey*cx);if(perp<L.w/2+e.r)damage(e,L.dps*0.08,{src:'laser'})}}
  }
  lasers=lasers.filter(L=>L.t<L.dur);
  // 视觉
  for(const b of bolts)b.t-=dt;bolts=bolts.filter(b=>b.t>0);
  for(const b of booms){b.t+=dt;b.r=b.max*Math.min(1,b.t/0.15)}booms=booms.filter(b=>b.t<0.35);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.92;p.vy*=0.92;p.t-=dt}parts=parts.filter(p=>p.t>0);
  for(const n of nums){n.y-=40*dt;n.t-=dt}nums=nums.filter(n=>n.t>0);
  // 经验
  run.gemStreakT-=dt;if(run.gemStreakT<=0)run.gemStreak=0;
  const mag=S.magnet;
  for(const g of gems){
    const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy);
    if(d<mag)g.mag=true;
    if(g.mag){const sp=Math.max(300,700-d);g.x+=dx/d*sp*dt;g.y+=dy/d*sp*dt}
    if(d<P.r+8){g.v=-g.v;gainXp(-g.v)}
  }
  gems=gems.filter(g=>g.v>0);
  if(gems.length>380){const far=gems.filter(g=>!g.mag);let sum=0;for(let i=0;i<far.length-200;i++){sum+=far[i].v;far[i].v=0}gems=gems.filter(g=>g.v>0);if(sum)gems.push({x:P.x+rand(-200,200),y:P.y+rand(-200,200),v:sum,mag:false})}
  for(const it of items){
    const dx=P.x-it.x,dy=P.y-it.y,d=Math.hypot(dx,dy);
    if(it.type==='coin'&&d<mag*0.8){it.x+=dx/d*400*dt;it.y+=dy/d*400*dt}
    if(d<P.r+14){it.done=true;pickItem(it)}
  }
  items=items.filter(i=>!i.done);
  for(const t of toasts)t.t-=dt;toasts=toasts.filter(t=>t.t>0);
  run.comboT-=dt;if(run.comboT<=0)run.combo=0;
  if(run.bossWarn>0)run.bossWarn-=dt;run.flash=Math.max(0,run.flash-dt*2);
  enemies=enemies.filter(e=>!e.dead);
  if(run.pendingLv>0&&state==='play')openLevelUp();
}
function explode(x,y,r,dmg,c,src){
  booms.push({x,y,r:0,max:r,t:0,c});sfx('boom');
  near(x,y,r+20,e=>{if(!e.dead&&(e.x-x)**2+(e.y-y)**2<(r+e.r)**2)damage(e,dmg,{kb:160,ang:Math.atan2(e.y-y,e.x-x),src})});
}
function gainXp(v){
  run.xp+=v*run.stats.xp;run.gemStreak++;run.gemStreakT=0.6;sfx('gem',run.gemStreak);
  while(run.xp>=run.xpNeed){run.xp-=run.xpNeed;run.lv++;run.xpNeed=xpNeed(run.lv);run.pendingLv++}
}
function pickItem(it){
  if(it.type==='coin'){run.coins+=it.v*run.stats.gold;sfx('coin')}
  else if(it.type==='heal'){P.hp=Math.min(run.stats.maxHp,P.hp+30);nums.push({x:P.x,y:P.y-20,v:'+30',t:0.8,heal:true});sfx('coin')}
  else if(it.type==='magnet'){for(const g of gems)g.mag=true;toast('磁暴：吸取全部经验','#00f5d4');sfx('chest')}
  else if(it.type==='chest')openChest(it.big);
}

/* ================= 首领 AI ================= */
function updateBoss(e,dt,d,mx,my){
  const b=e.boss;e.atkT-=dt;
  if(e.charge>0){e.charge-=dt;e.x+=e.cvx*dt;e.y+=e.cvy*dt;if(Math.random()<0.6)parts.push({x:e.x,y:e.y,vx:0,vy:0,t:0.4,c:b.color,s:8});return}
  if(e.tele>0){e.tele-=dt;if(e.tele<=0){e.charge=0.65;const sp=560;e.cvx=Math.cos(e.tang)*sp;e.cvy=Math.sin(e.tang)*sp;sfx('dash')}return}
  const keep=b.id==='weaver'?260:0;
  let vx=mx,vy=my;if(keep&&d<keep){vx=-my;vy=mx}
  e.x+=vx*e.spd*dt;e.y+=vy*e.spd*dt;
  if(e.atkT<=0){
    const pattern=b.id==='colossus'?['charge','ring'][e.phase++%2]:b.id==='weaver'?['radial','spiral','summon'][e.phase++%3]:['charge','radial','spiral','summon'][e.phase++%4];
    const hpr=e.hp/e.maxHp,fast=hpr<0.5?0.75:1;
    if(pattern==='charge'){e.tele=0.8;e.tang=Math.atan2(P.y-e.y,P.x-e.x);e.atkT=3.2*fast}
    else if(pattern==='ring'){shootRing(e,16,150,0);e.atkT=2.6*fast}
    else if(pattern==='radial'){const n=b.final?28:20;shootRing(e,n,160,Math.random());setTimeout(()=>{if(!e.dead&&state!=='menu')shootRing(e,n,160,Math.random()+0.5)},350);e.atkT=2.6*fast}
    else if(pattern==='spiral'){let k=0;e.spinT=setInterval(()=>{if(e.dead||state==='over'||state==='menu'||k++>18){clearInterval(e.spinT);return}if(state!=='play')return;for(let i=0;i<3;i++){const a=k*0.35+i*TAU/3;ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*190,vy:Math.sin(a)*190,r:6,dmg:e.dmg*0.6,life:5,c:b.color})}},90);e.atkT=3.2*fast}
    else if(pattern==='summon'){for(let i=0;i<10;i++){const a=i/10*TAU;enemies.push(makeEnemy(run.t>300?'runner':'grunt',e.x+Math.cos(a)*e.r*1.6,e.y+Math.sin(a)*e.r*1.6))}e.atkT=2.4*fast}
  }
}
function shootRing(e,n,sp,off){for(let i=0;i<n;i++){const a=off+i/n*TAU;ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:7,dmg:e.dmg*0.6,life:5,c:e.boss.color})}}

/* ================= 升级 / 宝箱 ================= */
function upgradePool(){
  const pool=[];const wc=Object.keys(run.weapons).length,pc=Object.keys(run.passives).length;
  for(const id in WEAPONS){const lv=run.weapons[id]||0;if(lv>=5||(!lv&&wc>=5))continue;pool.push({kind:'w',id,lv,w:lv?3:1.8})}
  for(const id in PASSIVES){const lv=run.passives[id]||0;if(lv>=PASSIVES[id].max||(!lv&&pc>=6))continue;pool.push({kind:'p',id,lv,w:lv?2.2:1.4})}
  for(const id of evoReady())pool.push({kind:'e',id,lv:5,w:9});
  return pool;
}
function evoReady(){const out=[];for(const id in run.weapons){if(run.weapons[id]>=5&&!run.evo[id]&&(run.passives[EVOS[id].with]||0)>=1)out.push(id)}return out}
function genChoices(){
  const pool=upgradePool();const out=[];
  while(out.length<3&&pool.length){const tot=pool.reduce((s,a)=>s+a.w,0);let r=Math.random()*tot,i=0;for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break}out.push(pool.splice(Math.min(i,pool.length-1),1)[0])}
  const cs=CURSES.filter(c=>!run.curses.includes(c.id));
  if(run.lv>=4&&cs.length&&Math.random()<0.25){const c=cs[Math.random()*cs.length|0];if(out.length>=3)out[2]={kind:'c',id:c.id};else out.push({kind:'c',id:c.id})}
  if(!out.length){out.push({kind:'heal'},{kind:'gold'})}
  return out;
}
function choiceInfo(c){
  if(c.kind==='w'){const w=WEAPONS[c.id];return{name:w.name,icon:w.icon,color:w.color,desc:w.desc[c.lv],lv:c.lv?('Lv'+c.lv+' → '+(c.lv+1)):'',isNew:!c.lv}}
  if(c.kind==='p'){const p=PASSIVES[c.id];return{name:p.name,icon:p.icon,color:p.color,desc:p.desc,lv:c.lv?('Lv'+c.lv+' → '+(c.lv+1)):'',isNew:!c.lv}}
  if(c.kind==='c'){const k=CURSES.find(x=>x.id===c.id);return{name:k.name,icon:'契',color:'#b388ff',desc:k.desc+'（每局限一次）',curse:true}}
  if(c.kind==='e'){const e=EVOS[c.id];return{name:'超级进化：'+e.name,icon:e.icon,color:e.color,desc:WEAPONS[c.id].name+' + '+PASSIVES[e.with].name+' → '+e.desc,evo:true}}
  if(c.kind==='heal')return{name:'应急修复',icon:'+',color:'#80ed99',desc:'回复 40 生命'};
  return{name:'金币袋',icon:'¥',color:'#ffd166',desc:'获得 25 金币'};
}
function applyChoice(c){
  if(c.kind==='w')run.weapons[c.id]=(run.weapons[c.id]||0)+1;
  else if(c.kind==='p')run.passives[c.id]=(run.passives[c.id]||0)+1;
  else if(c.kind==='c'){const k=CURSES.find(x=>x.id===c.id);run.curses.push(k.id);k.apply(run.mods)}
  else if(c.kind==='e'){run.evo[c.id]=1;toast('超级进化！'+EVOS[c.id].name,EVOS[c.id].color,2.6);run.flash=1.5;cam.shake=10;burst(P.x,P.y,EVOS[c.id].color,60,320);rings.push({x:P.x,y:P.y,r:10,max:420,dmg:80,id:nextId++,speed:900,c:EVOS[c.id].color,ult:true,slow:0,freeze:0});sfx('ult')}
  else if(c.kind==='heal')P.hp=Math.min(run.stats.maxHp,P.hp+40);
  else run.coins+=25;
  recalc();
}
function cardHTML(info){
  return '<div class="ic" style="background:'+info.color+'">'+info.icon+'</div><div><b>'+info.name+'</b>'+(info.isNew?'<span class="new">新</span>':'')+(info.lv?'<span class="lv">'+info.lv+'</span>':'')+'<p>'+info.desc+'</p></div>';
}
function renderChoices(){
  const list=$('cardList');list.innerHTML='';
  run.choices.forEach((c,i)=>{const info=choiceInfo(c);const b=document.createElement('button');b.className='card'+(info.curse?' curse':'')+(info.evo?' evo':'');b.innerHTML=cardHTML(info);
    b.onclick=()=>{sfx('click');applyChoice(c);run.pendingLv--;closeOverlay('levelup');if(run.pendingLv>0)openLevelUp()};list.appendChild(b)});
  const hasCurse=run.choices.some(c=>c.kind==='c');$('btnTakeAll').textContent=hasCurse?'🎁 全部拿走（免费，不含契约）':'🎁 全部拿走（免费）';
  const rb=$('btnReroll');rb.textContent='刷新（剩 '+run.rerolls+' 次）';rb.disabled=run.rerolls<=0;

function openChest(big){
  state='chest';sfx('chest');const n=big?3:(Math.random()<0.25?3:1);const got=[];
  for(let i=0;i<n;i++){
    const ev=evoReady();const pool=upgradePool().filter(c=>c.lv>0&&c.kind!=='e');const pl=ev.length?[{kind:'e',id:ev[0],lv:5}]:pool.length?pool:upgradePool();
    if(!pl.length){got.push({kind:'gold'});applyChoice({kind:'gold'});continue}

  for(const n of nums){const[x,y]=toScreen(n.x,n.y,0.7);ctx.globalAlpha=Math.min(1,n.t*3);ctx.font='bold '+(n.crit?20:n.hurt?17:13)+'px sans-serif';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(n.v,x,y);ctx.fillStyle=n.hurt?'#ff4d6d':n.heal?'#80ed99':n.crit?'#ffd166':'#fff';ctx.fillText(n.v,x,y)}ctx.globalAlpha=1;
  // 精英血条
  for(const e of enemies){if(!e.elite||e.dead)continue;const[x,y]=toScreen(e.x,e.y,e.r*K3*2.6);if(x<-40||x>W+40||y<-40||y>H+40)continue;const w=Math.max(28,e.r*zoom*1.6);ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x-w/2,y,w,5);ctx.fillStyle=e.affix.c;ctx.fillRect(x-w/2,y,w*Math.max(0,e.hp/e.maxHp),5)}
  // 屏幕外指示：首领 / 宝箱
  const edge=(wx_,wy_,color,label)=>{const[x,y]=toScreen(wx_,wy_,0.3);if(x>20&&x<W-20&&y>20&&y<H-20)return;const a=Math.atan2(y-H/2,x-W/2),r=Math.min(W,H)/2-36;ctx.save();ctx.translate(W/2+Math.cos(a)*r,H/2+Math.sin(a)*r);ctx.fillStyle=color;if(label){ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,0,0)}ctx.rotate(a);ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(11,-8);ctx.lineTo(11,8);ctx.fill();ctx.restore()};
  if(run.boss)edge(run.boss.x,run.boss.y,run.boss.boss.color,'王');
  for(const it of items)if(it.type==='chest')edge(it.x,it.y,'#ffd166','箱');
  // 屏幕滤镜
  if(slowT>0){ctx.fillStyle='rgba(92,242,255,'+(0.10*Math.min(1,slowT*2))+')';ctx.fillRect(0,0,W,H)}
  if(P.hitFlash>0){ctx.fillStyle='rgba(255,40,80,'+P.hitFlash*0.6+')';ctx.fillRect(0,0,W,H)}
  const hpr=P.hp/run.stats.maxHp;if(hpr<0.35){const a=(0.35-hpr)*1.6*(0.7+0.3*Math.sin(run.t*6));const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.7);g.addColorStop(0,'rgba(255,0,60,0)');g.addColorStop(1,'rgba(255,0,60,'+a+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  if(run.flash>0){ctx.fillStyle='rgba(255,209,102,'+run.flash*0.18+')';ctx.fillRect(0,0,W,H)}
  drawHUD();
}
function drawShip(x,y,a,col,white,mv){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  const fl=6+mv*10+Math.random()*4;
  ctx.globalCompositeOperation='lighter';const sp=glowDot(white?'#ffffff':col,5);ctx.drawImage(sp,-14-fl-sp.width/2,-sp.height/2);
  ctx.fillStyle=white?'#fff':'#ffb703';ctx.beginPath();ctx.moveTo(-9,-4);ctx.lineTo(-9-fl,0);ctx.lineTo(-9,4);ctx.fill();ctx.globalCompositeOperation='source-over';
  ctx.shadowColor=col;ctx.shadowBlur=14;ctx.fillStyle=white?'#ffffff':'#0d1830';ctx.strokeStyle=white?'#fff':col;ctx.lineWidth=2.2;
  ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(-8,-11);ctx.lineTo(-4,-3);ctx.lineTo(-10,0);ctx.lineTo(-4,3);ctx.lineTo(-8,11);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.shadowBlur=0;ctx.fillStyle=white?'#bff':col;ctx.beginPath();ctx.ellipse(3,0,4,2.6,0,0,TAU);ctx.fill();
  ctx.restore();
}
const STARS=Array.from({length:140},(_,i)=>({x:Math.random(),y:Math.random(),d:[0.08,0.18,0.35][i%3],s:[1,1.4,2][i%3]}));
const NEB=Array.from({length:6},()=>({x:Math.random()*3000-1500,y:Math.random()*3000-1500,r:300+Math.random()*400,c:['rgba(138,63,252,','rgba(26,167,201,','rgba(255,92,200,'][Math.random()*3|0]}));
function drawBackdrop(){
  for(const n of NEB){const k=0.25;const x=((n.x-cam.x*k)%3000+4500)%3000-1500+W/2,y=((n.y-cam.y*k)%3000+4500)%3000-1500+H/2;const g=ctx.createRadialGradient(x,y,0,x,y,n.r*zoom);g.addColorStop(0,n.c+'.10)');g.addColorStop(1,n.c+'0)');ctx.fillStyle=g;ctx.fillRect(x-n.r*zoom,y-n.r*zoom,n.r*2*zoom,n.r*2*zoom)}
  for(const s of STARS){const x=((s.x*W-cam.x*s.d*zoom)%W+W)%W,y=((s.y*H-cam.y*s.d*zoom)%H+H)%H;ctx.fillStyle='rgba(200,220,255,'+(0.25+s.d)+')';ctx.fillRect(x,y,s.s,s.s)}
}
function drawHUD(){
  const S=run.stats,top=safeT,ui=Math.max(0.85,Math.min(1.2,Math.min(W,H)/520));
  // 经验条
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(0,top,W,8);
  const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#4cc9f0');g.addColorStop(1,'#b388ff');ctx.fillStyle=g;ctx.fillRect(0,top,W*Math.min(1,run.xp/run.xpNeed),8);
  ctx.textBaseline='top';ctx.fillStyle='#fff';
  ctx.font='bold '+Math.round(22*ui)+'px sans-serif';ctx.textAlign='center';ctx.fillText(fmtTime(run.t),W/2,top+14);
  ctx.font='bold '+Math.round(13*ui)+'px sans-serif';ctx.fillStyle='#8fa0bf';ctx.fillText(run.t<RUN_LEN?('目标 08:00'):'最终首领！',W/2,top+16+24*ui);
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold '+Math.round(16*ui)+'px sans-serif';
  const lx=Math.max(12,safeL+10);ctx.fillText('Lv '+run.lv,lx,top+16);
  // 血条
  const bw=Math.min(170,W*0.32);ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(lx,top+40*ui,bw,10);ctx.fillStyle=P.hp/S.maxHp<0.3?'#ff4d6d':'#80ed99';ctx.fillRect(lx,top+40*ui,bw*Math.max(0,P.hp/S.maxHp),10);
  ctx.font=Math.round(11*ui)+'px sans-serif';ctx.fillStyle='#cfd8ea';ctx.fillText(Math.ceil(P.hp)+' / '+S.maxHp,lx,top+54*ui);
  // 武器图标
  let ix=lx;const iy=top+72*ui,is=Math.round(22*ui);
  for(const id in run.weapons){const w=WEAPONS[id],ev=run.evo[id];if(ev){ctx.fillStyle='#ffd166';ctx.fillRect(ix-2,iy-2,is+4,is+4)}ctx.fillStyle=ev?EVOS[id].color:w.color;ctx.globalAlpha=.9;ctx.fillRect(ix,iy,is,is);ctx.globalAlpha=1;ctx.fillStyle='#06101e';ctx.font='bold '+Math.round(13*ui)+'px sans-serif';ctx.textAlign='center';ctx.fillText(ev?EVOS[id].icon:w.icon,ix+is/2,iy+4*ui);ctx.fillStyle='#fff';ctx.font='bold '+Math.round(9*ui)+'px sans-serif';ctx.fillText(run.weapons[id],ix+is-3,iy+is-8);ix+=is+4}
  ctx.textAlign='left';
  // 右上
  ctx.textAlign='right';const rx=W-Math.max(12,safeR+10)-50;ctx.font='bold '+Math.round(14*ui)+'px sans-serif';ctx.fillStyle='#fff';ctx.fillText('击杀 '+run.kills,rx,top+16);
  ctx.fillStyle='#ffd166';ctx.fillText('金币 '+Math.floor(run.coins),rx,top+16+20*ui);
  // 冲刺 / 超载（键盘提示）
  if(!isTouch){
    ctx.textAlign='right';ctx.font=Math.round(12*ui)+'px sans-serif';ctx.fillStyle=P.dashCd>0?'#5a6a88':'#5cf2ff';ctx.fillText(P.dashCd>0?('冲刺 '+P.dashCd.toFixed(1)+'s'):'冲刺就绪 [空格]',W-16,H-safeB-44);
    ctx.fillStyle=run.ult>=100?'#ff5cc8':'#8fa0bf';ctx.fillText(run.ult>=100?'超载就绪 [E]':('超载 '+Math.floor(run.ult)+'%'),W-16,H-safeB-26);
    ctx.fillStyle='rgba(255,92,200,.25)';ctx.fillRect(W-136,H-safeB-10,120,5);ctx.fillStyle='#ff5cc8';ctx.fillRect(W-136,H-safeB-10,120*run.ult/100,5);
  }else{
    const u=$('btnUlt');u.style.setProperty('--u',run.ult);u.classList.toggle('ready',run.ult>=100);$('btnDash').classList.toggle('cd',P.dashCd>0);
    $('btnDash').textContent=P.dashCd>0?P.dashCd.toFixed(1):'冲刺';
  }
  // 首领血条
  if(run.boss){const e=run.boss,bw2=Math.min(420,W*0.7),bx=(W-bw2)/2,by=top+16+46*ui;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(bx,by,bw2,10);ctx.fillStyle=e.boss.color;ctx.fillRect(bx,by,bw2*Math.max(0,e.hp/e.maxHp),10);ctx.textAlign='center';ctx.font='bold '+Math.round(12*ui)+'px sans-serif';ctx.fillStyle='#fff';ctx.fillText(e.boss.name,W/2,by+14)}
  if(run.combo>=10){const a=Math.min(1,run.comboT);ctx.globalAlpha=a;ctx.textAlign='right';ctx.font='bold '+Math.round((18+Math.min(14,run.combo/20))*ui)+'px sans-serif';ctx.fillStyle=run.combo>=100?'#ff5cc8':run.combo>=50?'#ffd166':'#5cf2ff';ctx.fillText('连杀 ×'+run.combo,W-Math.max(14,safeR+12),H*0.42);ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(W-Math.max(14,safeR+12)-90,H*0.42+30*ui,90*Math.min(1,run.comboT/2.2),3);ctx.globalAlpha=1}
  if(run.bossWarn>0){const a=Math.min(1,run.bossWarn,(3.5-run.bossWarn)*3);const by2=H*0.18;ctx.globalAlpha=a*0.85;ctx.fillStyle='#2a0610';ctx.fillRect(0,by2,W,54*ui);ctx.save();ctx.beginPath();ctx.rect(0,by2,W,54*ui);ctx.clip();ctx.fillStyle='#ff4d6d';const off=(run.t*80)%40;for(let x=-40+off;x<W+40;x+=40){ctx.beginPath();ctx.moveTo(x,by2);ctx.lineTo(x+20,by2);ctx.lineTo(x+4,by2+8);ctx.lineTo(x-16,by2+8);ctx.fill();ctx.beginPath();ctx.moveTo(x,by2+54*ui-8);ctx.lineTo(x+20,by2+54*ui-8);ctx.lineTo(x+4,by2+54*ui);ctx.lineTo(x-16,by2+54*ui);ctx.fill()}ctx.restore();ctx.globalAlpha=a;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold '+Math.round(22*ui)+'px sans-serif';ctx.fillStyle='#ff4d6d';ctx.fillText('⚠ 警告：'+run.warnName+' 即将出现',W/2,by2+27*ui);ctx.textBaseline='top';ctx.globalAlpha=1}
  // 提示
  ctx.textAlign='center';let ty=H*0.3;
  for(const t of toasts.slice(-3)){const a=Math.min(1,t.t*3,(t.max-t.t)*8);ctx.globalAlpha=a;ctx.font='bold '+Math.round(22*ui)+'px sans-serif';ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillText(t.text,W/2+2,ty+2);ctx.fillStyle=t.color;ctx.fillText(t.text,W/2,ty);ty+=32*ui}ctx.globalAlpha=1;
  // 摇杆
  if(joy.active){ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.ox,joy.oy,60,0,TAU);ctx.stroke();ctx.fillStyle='rgba(92,242,255,.35)';ctx.beginPath();ctx.arc(joy.x,joy.y,24,0,TAU);ctx.fill()}
}
let menuT=0;
function drawMenuBg(){
  menuT+=1/60;ctx.strokeStyle='rgba(92,140,255,.08)';ctx.lineWidth=1;ctx.beginPath();const gs=60,ox=(menuT*20)%gs;
  for(let x=-ox;x<W;x+=gs){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=-ox;y<H;y+=gs){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
  for(let i=0;i<14;i++){const a=menuT*0.3+i*0.45,r=Math.min(W,H)*0.42+Math.sin(menuT+i)*20;const c=['#ff4d6d','#ffb703','#c77dff','#4cc9f0'][i%4];const sp=sprite(['circle','tri','square','diamond'][i%4],c,10);ctx.drawImage(sp,W/2+Math.cos(a)*r-sp.width/2,H/2+Math.sin(a)*r-sp.height/2)}
}

/* ================= 主循环 ================= */
let last=performance.now();
function frame(now){
  let dt=Math.min(0.05,(now-last)/1000);last=now;
  if(state==='play'){
    if(slowT>0){slowT-=dt;timeScale=0.3}else timeScale=Math.min(1,timeScale+dt*3);
    const gdt=dt*timeScale;
    // 分两步更新，减少高速穿透
    update(gdt/2);if(state==='play')update(gdt/2);
  }
  draw();
  requestAnimationFrame(frame);
}
openMenu();
requestAnimationFrame(frame);
</script>
